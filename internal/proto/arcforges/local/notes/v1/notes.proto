syntax = "proto3";

package arcforges.local.notes.v1;

import "arcforges/foundation/v1/foundation.proto";

option csharp_namespace = "ArcForges.Contracts.LocalRpc.Notes.V1";
option java_package = "io.github.arcforges.contracts.local.notes.v1";
option java_multiple_files = true;
option java_outer_classname = "NotesProto";

// Complete in-process operation result; no product RPC service is registered.
message NotesOperationsServiceTrashDocumentValue {
  arcforges.foundation.v1.LocalNotesVersion version = 10 [json_name = "version"];
}
