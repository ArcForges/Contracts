syntax = "proto3";

package arcforges.local.platform.v1;

import "arcforges/foundation/v1/foundation.proto";

option csharp_namespace = "ArcForges.Contracts.LocalRpc.Platform.V1";
option java_package = "io.github.arcforges.contracts.local.platform.v1";
option java_multiple_files = true;
option java_outer_classname = "PlatformProto";

// Private bounded byte transfer; hash identifies the whole versioned source.
message LocalChunk {
  optional bytes bytes = 1 [json_name = "bytes"];
  optional uint64 offset = 2 [json_name = "offset"];
  optional uint64 next_offset = 3 [json_name = "nextOffset"];
  optional bool eof = 4 [json_name = "eof"];
  optional string sha256 = 5 [json_name = "sha256"];
}

// Private launch descriptors are descriptive only; verified process/stream ownership
// and one-use HMAC secret establish identity. No discovery file or TCP fallback.
message LocalEndpoint {
  optional string transport = 1 [json_name = "transport"];
  optional string address = 2 [json_name = "address"];
  arcforges.foundation.v1.Id instance_id = 3 [json_name = "instanceId"];
}
message EndpointManifest {
  optional string schema_version = 1 [json_name = "schemaVersion"];
  optional string app_id = 2 [json_name = "appId"];
  arcforges.foundation.v1.Id installation_id = 3 [json_name = "installationId"];
  arcforges.foundation.v1.Id instance_id = 4 [json_name = "instanceId"];
  optional uint64 process_id = 5 [json_name = "processId"];
  arcforges.foundation.v1.Instant process_started_at = 6 [json_name = "processStartedAt"];
  LocalEndpoint endpoint = 7 [json_name = "endpoint"];
  optional string build_hash = 8 [json_name = "buildHash"];
  optional string contract_set_hash = 9 [json_name = "contractSetHash"];
  repeated uint32 contract_majors = 10 [json_name = "contractMajors"];
}

// Public projections contain no tokens or secret references. The owning parent
// verifies definition-hash-bound origins/scopes and current foreground consent.
message ConnectorDefinition {
  optional string definition_id = 1 [json_name = "definitionId"];
  optional string package_id = 2 [json_name = "packageId"];
  optional string package_version = 3 [json_name = "packageVersion"];
  optional string manifest_hash = 4 [json_name = "manifestHash"];
  optional string auth_kind = 5 [json_name = "authKind"];
  repeated string origins = 6 [json_name = "origins"];
  repeated string scopes = 7 [json_name = "scopes"];
  repeated string capabilities = 8 [json_name = "capabilities"];
}
message ConnectorConnection {
  arcforges.foundation.v1.Id connection_id = 1 [json_name = "connectionId"];
  optional string definition_id = 2 [json_name = "definitionId"];
  optional string name = 3 [json_name = "name"];
  optional string state = 4 [json_name = "state"];
  repeated string scopes = 5 [json_name = "scopes"];
  arcforges.foundation.v1.Revision revision = 6 [json_name = "revision"];
  arcforges.foundation.v1.Instant expires_at = 7 [json_name = "expiresAt"];
  optional string reason = 8 [json_name = "reason"];
}
message ConnectorChallenge {
  arcforges.foundation.v1.Id flow_id = 1 [json_name = "flowId"];
  arcforges.foundation.v1.Id connection_id = 2 [json_name = "connectionId"];
  optional string authorization_url = 3 [json_name = "authorizationUrl"];
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"];
}
// Secret input is delivered only to the owning secret boundary. Never log it,
// include it in public projections, or persist it outside the encrypted store.
message ConnectorProof {
  oneof proof {
    string callback_receipt = 1 [json_name = "callbackReceipt"];
    string personal_token = 2 [json_name = "personalToken"];
  }
}

// Launch-bound only: Challenge <=5s, HMAC-SHA256 Confirm once on the same connection, 32-byte peer nonce <=30s; renew each 10s.
service LocalBootstrapService {
  rpc Challenge(LocalBootstrapServiceChallengeRequest) returns (LocalBootstrapServiceChallengeResponse);
  rpc Confirm(LocalBootstrapServiceConfirmRequest) returns (LocalBootstrapServiceConfirmResponse);
  rpc Renew(LocalBootstrapServiceRenewRequest) returns (LocalBootstrapServiceRenewResponse);
}
message LocalBootstrapServiceChallengeRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id instance_id = 10 [json_name = "instanceId"];
  optional bytes challenge = 11 [json_name = "challenge"];
  EndpointManifest caller = 12 [json_name = "caller"];
}
message LocalBootstrapServiceChallengeResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    LocalBootstrapServiceChallengeValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message LocalBootstrapServiceChallengeValue {
  arcforges.foundation.v1.Id challenge_id = 10 [json_name = "challengeId"];
  optional bytes server_challenge = 11 [json_name = "serverChallenge"];
  arcforges.foundation.v1.Instant expires_at = 12 [json_name = "expiresAt"];
  EndpointManifest server = 13 [json_name = "server"];
}
message LocalBootstrapServiceConfirmRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id challenge_id = 10 [json_name = "challengeId"];
  optional bytes proof = 11 [json_name = "proof"];
}
message LocalBootstrapServiceConfirmResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    LocalBootstrapServiceConfirmValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message LocalBootstrapServiceConfirmValue {
  optional bytes peer_nonce = 10 [json_name = "peerNonce"];
  arcforges.foundation.v1.Instant expires_at = 11 [json_name = "expiresAt"];
}
message LocalBootstrapServiceRenewRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
}
message LocalBootstrapServiceRenewResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    LocalBootstrapServiceRenewValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message LocalBootstrapServiceRenewValue {
  arcforges.foundation.v1.Instant expires_at = 10 [json_name = "expiresAt"];
}

// Exact owning parent only; mutations require foreground human. Complete is non-idempotent: reconcile Get after loss. Revoke uses meta.expectedRev.
service ConnectorBrokerService {
  rpc ListDefinitions(ConnectorBrokerServiceListDefinitionsRequest) returns (ConnectorBrokerServiceListDefinitionsResponse);
  rpc ListConnections(ConnectorBrokerServiceListConnectionsRequest) returns (ConnectorBrokerServiceListConnectionsResponse);
  rpc BeginConnection(ConnectorBrokerServiceBeginConnectionRequest) returns (ConnectorBrokerServiceBeginConnectionResponse);
  rpc CompleteConnection(ConnectorBrokerServiceCompleteConnectionRequest) returns (ConnectorBrokerServiceCompleteConnectionResponse);
  rpc GetConnection(ConnectorBrokerServiceGetConnectionRequest) returns (ConnectorBrokerServiceGetConnectionResponse);
  rpc RevokeConnection(ConnectorBrokerServiceRevokeConnectionRequest) returns (ConnectorBrokerServiceRevokeConnectionResponse);
}
message ConnectorBrokerServiceListDefinitionsRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.PageRequest page = 10 [json_name = "page"];
}
message ConnectorBrokerServiceListDefinitionsResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceListDefinitionsValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceListDefinitionsValue {
  repeated ConnectorDefinition items = 10 [json_name = "items"];
  arcforges.foundation.v1.PageState page = 11 [json_name = "page"];
}
message ConnectorBrokerServiceListConnectionsRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.PageRequest page = 10 [json_name = "page"];
}
message ConnectorBrokerServiceListConnectionsResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceListConnectionsValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceListConnectionsValue {
  repeated ConnectorConnection items = 10 [json_name = "items"];
  arcforges.foundation.v1.PageState page = 11 [json_name = "page"];
}
message ConnectorBrokerServiceBeginConnectionRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id connection_id = 10 [json_name = "connectionId"];
  optional string definition_id = 11 [json_name = "definitionId"];
  optional string name = 12 [json_name = "name"];
}
message ConnectorBrokerServiceBeginConnectionResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceBeginConnectionValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceBeginConnectionValue {
  ConnectorChallenge challenge = 10 [json_name = "challenge"];
}
message ConnectorBrokerServiceCompleteConnectionRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id flow_id = 10 [json_name = "flowId"];
  ConnectorProof proof = 11 [json_name = "proof"];
}
message ConnectorBrokerServiceCompleteConnectionResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceCompleteConnectionValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceCompleteConnectionValue {
  ConnectorConnection connection = 10 [json_name = "connection"];
}
message ConnectorBrokerServiceGetConnectionRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id connection_id = 10 [json_name = "connectionId"];
}
message ConnectorBrokerServiceGetConnectionResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceGetConnectionValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceGetConnectionValue {
  ConnectorConnection connection = 10 [json_name = "connection"];
}
message ConnectorBrokerServiceRevokeConnectionRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id connection_id = 10 [json_name = "connectionId"];
}
message ConnectorBrokerServiceRevokeConnectionResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ConnectorBrokerServiceRevokeConnectionValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message ConnectorBrokerServiceRevokeConnectionValue {
  ConnectorConnection connection = 10 [json_name = "connection"];
}
