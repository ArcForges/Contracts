message ScopeOperationsServiceGenerateReportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  ReportRequest request = 10 [json_name = "request"];
}

message ScopeOperationsServiceGenerateReportValue {
  arcforges.foundation.v1.ArtifactRef artifact = 10 [json_name = "artifact"];
}

message ScopeOperationsServiceGenerateReportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ScopeOperationsServiceGenerateReportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
