message ScopeOperationsServiceGetStructuredContextRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.publicapi.v1.ContextRequest request = 10 [json_name = "request"];
}

message ScopeOperationsServiceGetStructuredContextValue {
  arcforges.publicapi.v1.ContextContribution contribution = 10 [json_name = "contribution"];
}

message ScopeOperationsServiceGetStructuredContextResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
