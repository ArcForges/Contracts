  reserved 5 to 9;
}

message ScopeOperationsServiceStartCaptureRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id capture_id = 10 [json_name = "captureId"];
  CaptureRequest request = 11 [json_name = "request"];
}

message ScopeOperationsServiceStartCaptureValue {
  CaptureView capture = 10 [json_name = "capture"];
}

message ScopeOperationsServiceStartCaptureResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
