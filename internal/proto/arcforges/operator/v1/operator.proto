syntax = "proto3";

package arcforges.operator.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/catalog/v1/catalog.proto";
import "arcforges/publicapi/v1/commerce.proto";
import "arcforges/publicapi/v1/content.proto";

option csharp_namespace = "ArcForges.Contracts.CloudInternal.Operator.V1";
option java_package = "io.github.arcforges.contracts.operator.v1";
option java_multiple_files = true;
option java_outer_classname = "OperatorProto";

// Internal operator-origin contracts only. This service is not exposed by the
// public origin and does not establish authorization merely from its shapes.
// Read/query responses leave tag 4 unreserved so the registry's large-read encodedBody outcome can be
// added compatibly; operator reads are bounded by paging and the 1 MiB configuration limit today.
service OperatorService {
  rpc ListCases(OperatorServiceListCasesRequest) returns (OperatorServiceListCasesResponse);
  rpc GetCase(OperatorServiceGetCaseRequest) returns (OperatorServiceGetCaseResponse);
  rpc RequestAccess(OperatorServiceRequestAccessRequest) returns (OperatorServiceRequestAccessResponse);
  rpc ApproveAccess(OperatorServiceApproveAccessRequest) returns (OperatorServiceApproveAccessResponse);
  rpc EndAccess(OperatorServiceEndAccessRequest) returns (OperatorServiceEndAccessResponse);
  rpc ReadDiagnostic(OperatorServiceReadDiagnosticRequest) returns (OperatorServiceReadDiagnosticResponse);
  rpc ProposeEnforcement(OperatorServiceProposeEnforcementRequest) returns (OperatorServiceProposeEnforcementResponse);
  rpc DecideEnforcement(OperatorServiceDecideEnforcementRequest) returns (OperatorServiceDecideEnforcementResponse);
  rpc GetAppeal(OperatorServiceGetAppealRequest) returns (OperatorServiceGetAppealResponse);
  rpc ResolveAppeal(OperatorServiceResolveAppealRequest) returns (OperatorServiceResolveAppealResponse);
  rpc StageConfiguration(OperatorServiceStageConfigurationRequest) returns (OperatorServiceStageConfigurationResponse);
  rpc ValidateConfiguration(OperatorServiceValidateConfigurationRequest) returns (OperatorServiceValidateConfigurationResponse);
  rpc ApproveConfiguration(OperatorServiceApproveConfigurationRequest) returns (OperatorServiceApproveConfigurationResponse);
  rpc ActivateConfiguration(OperatorServiceActivateConfigurationRequest) returns (OperatorServiceActivateConfigurationResponse);
  rpc GetConfiguration(OperatorServiceGetConfigurationRequest) returns (OperatorServiceGetConfigurationResponse);
  rpc SetKillSwitch(OperatorServiceSetKillSwitchRequest) returns (OperatorServiceSetKillSwitchResponse);
  rpc StartBreakGlass(OperatorServiceStartBreakGlassRequest) returns (OperatorServiceStartBreakGlassResponse);
  rpc EndBreakGlass(OperatorServiceEndBreakGlassRequest) returns (OperatorServiceEndBreakGlassResponse);
  rpc ProposeAction(OperatorServiceProposeActionRequest) returns (OperatorServiceProposeActionResponse);
  rpc ApproveAction(OperatorServiceApproveActionRequest) returns (OperatorServiceApproveActionResponse);
  rpc GetProposal(OperatorServiceGetProposalRequest) returns (OperatorServiceGetProposalResponse);
  rpc GrantEntitlement(OperatorServiceGrantEntitlementRequest) returns (OperatorServiceGrantEntitlementResponse);
  rpc RevokeEntitlement(OperatorServiceRevokeEntitlementRequest) returns (OperatorServiceRevokeEntitlementResponse);
  rpc IssueCompensation(OperatorServiceIssueCompensationRequest) returns (OperatorServiceIssueCompensationResponse);
  rpc AdjustCompensation(OperatorServiceAdjustCompensationRequest) returns (OperatorServiceAdjustCompensationResponse);
  rpc DecideRefund(OperatorServiceDecideRefundRequest) returns (OperatorServiceDecideRefundResponse);
  rpc GetCatalogSubmission(OperatorServiceGetCatalogSubmissionRequest) returns (OperatorServiceGetCatalogSubmissionResponse);
  rpc ReplyCase(OperatorServiceReplyCaseRequest) returns (OperatorServiceReplyCaseResponse);
  rpc SetCaseState(OperatorServiceSetCaseStateRequest) returns (OperatorServiceSetCaseStateResponse);
  rpc ReviewCatalogSubmission(OperatorServiceReviewCatalogSubmissionRequest) returns (OperatorServiceReviewCatalogSubmissionResponse);
  rpc RevokeCatalogVersion(OperatorServiceRevokeCatalogVersionRequest) returns (OperatorServiceRevokeCatalogVersionResponse);
}

