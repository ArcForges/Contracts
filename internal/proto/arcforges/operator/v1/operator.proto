syntax = "proto3";

package arcforges.operator.v1;

import "arcforges/foundation/v1/foundation.proto";

option csharp_namespace = "ArcForges.Contracts.CloudInternal.Operator.V1";
option java_package = "io.github.arcforges.contracts.operator.v1";
option java_multiple_files = true;
option java_outer_classname = "OperatorProto";

// Shape validation does not establish case/incident access or authority.
message OperatorCallContext {
  oneof context {
    arcforges.foundation.v1.Id case_id = 1 [json_name = "caseId"];
    arcforges.foundation.v1.Id incident_id = 2 [json_name = "incidentId"];
  }
  optional string purpose = 3 [json_name = "purpose"];
}
