// SPDX-License-Identifier: Apache-2.0
// ArcForges flagship design specification. Canonical once adopted by the Contracts repository.
syntax = "proto3";

package arcforges.relay.v1;

import "arcforges/fleet/v1/fleet.proto";
import "arcforges/foundation/v1/foundation.proto";
import "arcforges/node/v1/common.proto";

option csharp_namespace = "ArcForges.Contracts.Relay.V1";
option java_package = "io.github.arcforges.contracts.relay.v1";
option java_multiple_files = true;
option java_outer_classname = "RelayProto";

// Relay frames (internal): node <-> FleetHub Durable Object (RelayFrame over WebSocket /v1/node),
// viewer <-> FleetHub (ViewerFrame over WebSocket /v1/view), and FleetHub <-> C# host (HostEnvelope).
// The Durable Object reads only frame headers and token claims; payloads are opaque to it (AD-0009 section 2).
//
// AF-CTR-05 (target; Plan decisions Q15, PB-3 and PB-4, the D0 review addendum D0-B1 and D0-B2; Design 11 sections 1 and 3;
// AD-0021 sections 9 to 11): the node channel to the configured Go center is a WebSocket on GET <center>/fleet/v1/node with the
// subprotocol arcforges.relay.v1, one binary RelayFrame per message, frame_version 1. The center sends ChannelChallenge first;
// the node answers NodeHello with its hello proof within 10 s; the center answers ChannelAccepted, and only then sends calls
// (ChannelCall) and relay nonces (RelayNonce). On this channel the two sides use node_hello, token_refresh, close and the members
// 23 to 29 of RelayFrame. The other members belong to the unserved FleetHub relay of AD-0009 (history); command and
// command_result (15, 16) carry the two legacy bare SignedBlob signatures that Design 11 section 3 names as exceptions, and
// AF-CTR-05 nodes and centers neither send nor accept them.
//
// Signatures of the node channel (Design 11 section 3, "Signature domain strings"; Plan decision PB-3). Each is ES256 (ECDSA P-256
// with SHA-256) over a fixed ASCII domain string of its own followed by its signed bytes, in IEEE P1363 form r||s (64 bytes, r and
// s in [1, n-1], low-S: s <= n/2; the signer normalizes s and the verifier refuses a high-S signature). No signature is valid as
// another kind, and a signature over the signed bytes without their domain string is refused.
//   routed call (center command key):     "ArcForges relay-call v1\n" (24 bytes) || SignedHeader.header (the exact CallHeader bytes)
//   routed result (node key):             "ArcForges relay-result v1\n" (26 bytes) || SignedHeader.header (the exact ResultHeader bytes)
//   channel hello proof (node key):       "ArcForges relay-hello v1\n" (25 bytes) || nonce (32) || connection_id (16)
//                                         || SHA-256(audience) (32) || node_id (16) || installation_id (16); 137 bytes in all
//   relay assertion (relaying node key):  "ArcForges relay-origin v1\n" (26 bytes) || SHA-256(audience) (32) || relaying_node_id (16)
//                                         || relaying_installation_id (16) || local_origin (1) || local_session_id (16) || method (1)
//                                         || request_sha256 (32) || target_node_id (16) || command_id (16) || relay_nonce (32)
//                                         || issued_at (12) || expires_at (12); 228 bytes in all
// An ID is the 16 bytes of its foundation Id.value; an absent ID (the target_node_id of LIST_NODES, the command_id of a read) is
// 16 zero bytes. local_origin and method are one byte each, the enum number. An instant is unix_seconds as 8 bytes big-endian
// two's complement followed by nanos as 4 bytes big-endian. audience is the full canonical center URL, as for the node key proof
// (fleet.proto, "Node key proof"), and is not sent: the center uses SHA-256 of its own canonical public base URL, the node that
// of the center URL it is configured with. Every field has a fixed length. Header digests and signatures cover the exact
// transmitted bytes (AD-0021 section 10): a verifier checks the signature over the bytes it received and never re-encodes a
// decoded header. Golden vectors: fixtures/internal/af-ctr-05-relay-vectors.json.
// Verifier pre-conditions (review A N-4). Before it builds a hello or relay-origin signing input, a verifier refuses a message
// whose fields do not have the exact layout: every ID present where the layout names it, its value exactly 16 bytes and not all
// zero; every digest and nonce exactly 32 bytes; local_origin 1..3 and method 1..8; nanos 0..999,999,999. It never pads,
// truncates or re-encodes a field to fit. A NodeHello without node_id, or with an ID of another length, closes 4403. A call
// expires at most 300 s after issue and a relay assertion at most 120 s after issue; the 120 s skew applies on top at the node.
// The C# validators of these messages (ArcForges.Contracts.Relay) enforce every one of these rules except the presence of
// NodeHello.node_id, which the center checks (deviation 11: an earlier field keeps its presence-only sidecar); the Go center
// applies the same checks before verification.

message RelayLimits {
  optional uint32 summary_frames_per_minute = 1 [json_name = "summaryFramesPerMinute"]; // default 30
  optional uint32 delta_frames_per_minute = 2 [json_name = "deltaFramesPerMinute"]; // default 60 while demanded
  optional uint64 bytes_per_day = 3 [json_name = "bytesPerDay"]; // default 500 MiB per account
  optional uint32 snapshot_max_bytes = 4 [json_name = "snapshotMaxBytes"]; // default 256 KiB
  optional uint32 viewers_max = 5 [json_name = "viewersMax"]; // default 5
  optional uint32 commands_per_hour = 6 [json_name = "commandsPerHour"]; // default 120
}

// Claims of the node token (HMAC-SHA256; aud "relay.node"; 15 minutes).
message RelayTokenClaims {
  optional string aud = 1 [json_name = "aud"];
  arcforges.foundation.v1.Id account_id = 2 [json_name = "accountId"];
  arcforges.foundation.v1.Id node_id = 3 [json_name = "nodeId"];
  arcforges.foundation.v1.Instant issued_at = 4 [json_name = "issuedAt"];
  arcforges.foundation.v1.Instant expires_at = 5 [json_name = "expiresAt"];
  repeated string kinds_allowed = 6 [json_name = "kindsAllowed"];
  RelayLimits limits = 7 [json_name = "limits"];
  optional string kid = 8 [json_name = "kid"];
}

// Claims of the viewer grant (HMAC-SHA256; aud "relay.view"; 10 minutes).
message ViewerGrantClaims {
  optional string aud = 1 [json_name = "aud"];
  arcforges.foundation.v1.Id account_id = 2 [json_name = "accountId"];
  repeated arcforges.foundation.v1.Id node_ids = 3 [json_name = "nodeIds"];
  optional arcforges.fleet.v1.DetailLevel detail = 4 [json_name = "detail"];
  arcforges.foundation.v1.Instant issued_at = 5 [json_name = "issuedAt"];
  arcforges.foundation.v1.Instant expires_at = 6 [json_name = "expiresAt"];
  RelayLimits limits = 7 [json_name = "limits"];
  arcforges.foundation.v1.Id viewer_session_id = 8 [json_name = "viewerSessionId"];
  optional string kid = 9 [json_name = "kid"];
}

// The node's first frame, the answer to ChannelChallenge (AF-CTR-05: Plan decision PB-4, D0-B2). The center checks that node_id
// and installation_id equal the enrolled node and the installation of the bearer credential that opened this connection (else
// it closes 4403), and verifies hello_signature against the key registered for that installation, never a key the hello names,
// over the channel hello proof built from this connection's own nonce and connection ID; the node does not send them back, so a
// proof over another connection's challenge fails. Only then is the connection the node's, an older connection of the node is
// closed 4409, and calls may follow.
message NodeHello {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional string version = 2 [json_name = "version"];
  optional uint64 generation = 3 [json_name = "generation"];
  optional uint64 last_seq = 4 [json_name = "lastSeq"];
  optional string contract_version = 5 [json_name = "contractVersion"]; // validate: 1..64 chars; the Contracts cohort the node was built with
  repeated string capabilities = 6 [json_name = "capabilities"]; // validate: <= 16 unique entries of ^[a-z][a-z0-9.-]{0,31}$, e.g. routed.v1
  arcforges.foundation.v1.Id installation_id = 7 [json_name = "installationId"]; // validate: required; the bearer credential's installation
  optional bytes hello_signature = 8 [json_name = "helloSignature"]; // validate: required; 64 bytes; the channel hello proof
}

message DemandSignal {
  optional uint32 interval_ms = 1 [json_name = "intervalMs"]; // >= 2,000
  optional uint32 duration_ms = 2 [json_name = "durationMs"]; // <= 600,000; renewed while watched
  optional arcforges.fleet.v1.DetailLevel detail = 3 [json_name = "detail"];
}

message PushEvent {
  optional string kind = 1 [json_name = "kind"]; // node.task_failed | node.task_finished | node.approval_needed | node.finding
  arcforges.foundation.v1.Id subject_id = 2 [json_name = "subjectId"];
  optional string title = 3 [json_name = "title"];
  optional arcforges.node.v1.Severity severity = 4 [json_name = "severity"];
  arcforges.foundation.v1.Instant at = 5 [json_name = "at"];
  optional string dedup_key = 6 [json_name = "dedupKey"];
}

message EventBatch {
  repeated PushEvent events = 1 [json_name = "events"]; // <= 50 per batch
}

// On the AF-CTR-05 node channel, TokenRefresh carries an access token of the same session family that opened the connection; a
// token of another node or another installation closes 4403, so the connection's installation key (the key of results and of
// relay assertions) never changes during the connection (review A N-5).
message TokenRefresh {
  optional string token = 1 [json_name = "token"];
}

message EntitlementChanged {
  optional int64 entitlement_version = 1 [json_name = "entitlementVersion"];
}

message RelayClose {
  // AF-CTR-05 node channel (Plan CTR5-HUB-11): 4401 credential expired or revoked (no TokenRefresh within 120 s of the bound
  // access token's expiry, or a revocation); 4403 refused (feature, plan or account state, a node or installation mismatch, a
  // failed hello proof, an unverifiable result); 4408 hello or heartbeat deadline; 4409 replaced by a newer proved connection of
  // the node; 4413 frame too large; 4429 rate limited; 4500 center shutting down (reconnect after a jittered delay); 4503 kill
  // switch (reserved, AF-CLD-04). A node treats an abnormal close (1006, 1011) like 4500.
  optional uint32 code = 1 [json_name = "code"]; // 4401 token expired, 4403 refused, 4408 idle, 4429 rate limited, 4503 kill switch
  optional string reason = 2 [json_name = "reason"];
  optional uint32 reconnect_after_ms = 3 [json_name = "reconnectAfterMs"]; // validate: 0..300,000; meaningful with code 4500 only: the jittered delay the center asks the node to wait before it reconnects (Plan CTR5-HUB-11); absent or with another code, the node uses its own backoff
}

message RelayAck {
  optional uint64 through_seq = 1 [json_name = "throughSeq"];
}

message OutputTail {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  arcforges.foundation.v1.Id task_id = 2 [json_name = "taskId"];
  arcforges.foundation.v1.Id command_id = 3 [json_name = "commandId"];
  optional bytes data = 4 [json_name = "data"];
  optional bool truncated = 5 [json_name = "truncated"];
}

message RelayFrame {
  optional uint32 frame_version = 1 [json_name = "frameVersion"]; // 1
  optional uint64 frame_seq = 2 [json_name = "frameSeq"]; // per connection and direction
  oneof frame {
    NodeHello node_hello = 10 [json_name = "nodeHello"]; // node -> DO
    arcforges.fleet.v1.StatusSummary summary = 11 [json_name = "summary"]; // node -> DO
    arcforges.fleet.v1.StatusDelta delta = 12 [json_name = "delta"]; // node -> DO
    arcforges.fleet.v1.NodeSnapshot snapshot = 13 [json_name = "snapshot"]; // node -> DO
    DemandSignal demand = 14 [json_name = "demand"]; // DO -> node
    arcforges.fleet.v1.SignedBlob command = 15 [json_name = "command"]; // DO -> node; payload NodeCommand
    arcforges.fleet.v1.SignedBlob command_result = 16 [json_name = "commandResult"]; // node -> DO; payload NodeCommandResult
    EventBatch events = 17 [json_name = "events"]; // node -> DO
    TokenRefresh token_refresh = 18 [json_name = "tokenRefresh"]; // node -> DO
    EntitlementChanged entitlement_changed = 19 [json_name = "entitlementChanged"]; // DO -> node
    RelayClose close = 20 [json_name = "close"]; // either direction
    RelayAck ack = 21 [json_name = "ack"]; // either direction
    OutputTail output_tail = 22 [json_name = "outputTail"]; // node -> DO
    ChannelCall call = 23 [json_name = "call"]; // center -> node (AF-CTR-05)
    ChannelResult call_result = 24 [json_name = "callResult"]; // node -> center (AF-CTR-05)
    ChannelHeartbeat heartbeat = 25 [json_name = "heartbeat"]; // either direction (AF-CTR-05)
    ChannelAccepted accepted = 26 [json_name = "accepted"]; // center -> node (AF-CTR-05)
    ChannelChallenge challenge = 27 [json_name = "challenge"]; // center -> node, the first frame (AF-CTR-05)
    RelayNonceRequest relay_nonce_request = 28 [json_name = "relayNonceRequest"]; // node -> center (AF-CTR-05)
    RelayNonce relay_nonce = 29 [json_name = "relayNonce"]; // center -> node (AF-CTR-05)
  }
}

// The center-routed methods (fleet.v1 FleetService). 1..6 are the routed task methods, the calls a center sends; LIST_NODES and
// GET_NODE are named only by a relay assertion. The numbers 1..6 are the node store's routed_call_log.method.
enum RoutedMethod {
  ROUTED_METHOD_UNSPECIFIED = 0;
  ROUTED_METHOD_SUBMIT_NODE_TASK = 1; // payload TaskServiceSubmitTaskRequest
  ROUTED_METHOD_GET_NODE_TASK = 2; // payload TaskServiceGetTaskRequest
  ROUTED_METHOD_LIST_NODE_TASKS = 3; // payload TaskServiceListTasksRequest
  ROUTED_METHOD_WAIT_NODE_TASK = 4; // payload TaskServiceWaitTaskRequest
  ROUTED_METHOD_READ_NODE_TASK_OUTPUT = 5; // payload TaskServiceReadTaskOutputRequest
  ROUTED_METHOD_CANCEL_NODE_TASK = 6; // payload TaskServiceCancelTaskRequest
  ROUTED_METHOD_LIST_NODES = 7; // relay assertions only
  ROUTED_METHOD_GET_NODE = 8; // relay assertions only
}

// What the node did with a routed call; the numbers are the node store's routed_call_log.decision 1..4.
enum RoutedOutcome {
  ROUTED_OUTCOME_UNSPECIFIED = 0;
  ROUTED_OUTCOME_EXECUTED = 1; // the TaskService handler ran; the payload is its response, a value or the handler's own ArcError
  ROUTED_OUTCOME_REFUSED_BY_POLICY = 2; // the center-routed policy or the permission matrix refused, an approval raised included
  ROUTED_OUTCOME_REFUSED_VERIFICATION = 3; // the call failed the node's verification (Design 11 T-11), a replayed call ID included
  ROUTED_OUTCOME_EXPIRED = 4; // verified, but expired at the re-check immediately before the effect
}

// The center's first frame on a new connection (Plan decision PB-4, D0-B2). The nonce is accepted once, only on this connection,
// and is void at the hello deadline or when the connection closes.
message ChannelChallenge {
  optional bytes nonce = 1 [json_name = "nonce"]; // validate: required; 32 random bytes
  arcforges.foundation.v1.Id connection_id = 2 [json_name = "connectionId"]; // validate: required
  arcforges.foundation.v1.Instant hello_deadline = 3 [json_name = "helloDeadline"]; // validate: required; 10 s after the upgrade; no valid NodeHello by then closes 4408
}

// The center's limits for one connection (Plan CTR5-HUB-03, CTR5-HUB-10).
message ChannelLimits {
  optional uint32 max_frame_bytes = 1 [json_name = "maxFrameBytes"]; // validate: required; exactly 1,048,576 (1 MiB, Plan CTR5-HUB-03), so the largest call (253,952-byte payload) and result (1,040,384-byte payload) frames always fit; a larger frame closes 4413
  optional uint32 max_in_flight_calls = 2 [json_name = "maxInFlightCalls"]; // validate: required; 1..64 (default 8)
  optional uint32 heartbeat_interval_ms = 3 [json_name = "heartbeatIntervalMs"]; // validate: required; 5,000..60,000 (default 25 s)
  optional uint32 heartbeat_deadline_ms = 4 [json_name = "heartbeatDeadlineMs"]; // validate: required; 10,000..300,000 and above heartbeat_interval_ms (default 60 s); silence that long closes 4408
  optional uint32 max_relay_nonces = 5 [json_name = "maxRelayNonces"]; // validate: required; 1..64 (default 8); unspent relay nonces held per connection; a newer one voids the oldest
}

// The center's answer to a proved NodeHello: the connection is now the node's.
message ChannelAccepted {
  arcforges.foundation.v1.Id connection_id = 1 [json_name = "connectionId"]; // validate: required; the challenge's connection ID
  ChannelLimits limits = 2 [json_name = "limits"]; // validate: required
  repeated string signing_kids = 3 [json_name = "signingKids"]; // validate: 1..8 unique kids of ^[A-Za-z0-9_-]{8,64}$; the command keys calls may be signed with; an unknown kid makes the node refresh its session once before it accepts calls (PN-14)
  optional string node_name = 4 [json_name = "nodeName"]; // validate: 1..64 chars; the account's name for the node (RenameNode); the node keeps its own as FleetNode.reported_name (Plan decision Q25)
}

// Liveness, either direction: the center sends one every heartbeat_interval_ms and the node answers with the same seq.
message ChannelHeartbeat {
  arcforges.foundation.v1.Instant sent_at = 1 [json_name = "sentAt"]; // validate: required
  optional uint64 seq = 2 [json_name = "seq"]; // validate: required
}

// A header and its domain-separated signature. It is never a SignedBlob: the signature covers the domain string of its kind
// followed by header (see "Signatures of the node channel" above), never header alone.
message SignedHeader {
  optional bytes header = 1 [json_name = "header"]; // validate: required; 1..2,048 bytes; the exact CallHeader or ResultHeader bytes
  optional bytes signature = 2 [json_name = "signature"]; // validate: required; 64 bytes, P1363, low-S
  optional string kid = 3 [json_name = "kid"]; // validate: ^[A-Za-z0-9_-]{8,64}$; the command key of a call (required on ChannelCall); absent on a result, whose key is the connection's installation key
  optional string algorithm = 4 [json_name = "algorithm"]; // validate: required; "ES256"
}

// The signed header of a routed call (Plan CTR5-SIG-01, PN-9). The center serializes it once and signs the routed-call domain
// string followed by those bytes with its command key. Before it decodes the header or parses the payload, the node verifies the
// signature over the bytes it received against its key set for its configured center; then, before its policy decides (Design
// 11 T-11), it checks that kid equals SignedHeader.kid, center_url_sha256 its configured center, account_id and target_node_id
// its own link, call_id ChannelCall.call_id and not already logged (call_replayed, also after a restart), method, request_size
// and request_sha256 the payload, and that expires_at plus the 120 s skew has not passed, again immediately before the effect.
message CallHeader {
  arcforges.foundation.v1.Id call_id = 1 [json_name = "callId"]; // validate: required; random, one per call
  optional string kid = 2 [json_name = "kid"]; // validate: required; ^[A-Za-z0-9_-]{8,64}$; equals SignedHeader.kid
  optional bytes center_url_sha256 = 3 [json_name = "centerUrlSha256"]; // validate: required; 32 bytes: SHA-256 of the center's canonical public base URL
  arcforges.foundation.v1.Id account_id = 4 [json_name = "accountId"]; // validate: required; the account that owns the target node
  arcforges.foundation.v1.Id target_node_id = 5 [json_name = "targetNodeId"]; // validate: required
  arcforges.node.v1.CenterCaller caller = 6 [json_name = "caller"]; // validate: required; filled by the center only from the verified session or relay assertion, never from a request field
  arcforges.foundation.v1.Id command_id = 7 [json_name = "commandId"]; // validate: required for SUBMIT_NODE_TASK and CANCEL_NODE_TASK, absent otherwise; equals the payload's meta.command_id
  optional RoutedMethod method = 8 [json_name = "method"]; // validate: required; 1..6
  optional bytes request_sha256 = 9 [json_name = "requestSha256"]; // validate: required; 32 bytes: SHA-256 of the payload, the exact node.v1 request bytes
  optional uint32 request_size = 10 [json_name = "requestSize"]; // validate: required; 1..253,952; the payload's length
  arcforges.foundation.v1.Instant issued_at = 11 [json_name = "issuedAt"]; // validate: required
  arcforges.foundation.v1.Instant expires_at = 12 [json_name = "expiresAt"]; // validate: required; issued_at < expires_at <= issued_at + 300 s (AD-0021 section 10)
  arcforges.foundation.v1.Instant deadline = 13 [json_name = "deadline"]; // validate: required; issued_at < deadline <= expires_at; when the center stops waiting for the result
  optional bytes relay_assertion_sha256 = 14 [json_name = "relayAssertionSha256"]; // validate: required for a NODE_RELAY caller, absent otherwise; 32 bytes: SHA-256 of the relay_assertion bytes the routed request carried; the target never receives the assertion and cannot check this digest: it links the call to the center's audit and log, and the target relies on caller.relaying_node_id, which the center signed (review A N-8)
}

// A routed call, center -> node. payload is the exact node.v1 TaskService request bytes the caller sent in the routed request's
// request field, never re-encoded (Plan decision Q9).
message ChannelCall {
  arcforges.foundation.v1.Id call_id = 1 [json_name = "callId"]; // validate: required; equals CallHeader.call_id
  SignedHeader header = 2 [json_name = "header"]; // validate: required; a CallHeader under the routed-call domain string, with kid
  optional bytes payload = 3 [json_name = "payload"]; // validate: required; 1..253,952 bytes
}

// The signed header of a routed result (Plan CTR5-SIG-03, PN-9), signed by the node key under the routed-result domain string.
// The center verifies it against the key registered for the connection's installation, then checks call_id (an open call of this
// connection), node_id (the connection's node), the echoed method, command_id and request_sha256, and response_size and
// response_sha256 against the payload; any failure fails the call STATE/node_unreachable (result_unverifiable) and closes 4403.
message ResultHeader {
  arcforges.foundation.v1.Id call_id = 1 [json_name = "callId"]; // validate: required; ChannelCall.call_id
  arcforges.foundation.v1.Id command_id = 2 [json_name = "commandId"]; // validate: the call header's command_id when it names one; absent for REFUSED_VERIFICATION
  arcforges.foundation.v1.Id node_id = 3 [json_name = "nodeId"]; // validate: required; the answering node
  optional RoutedMethod method = 4 [json_name = "method"]; // validate: required (1..6) unless REFUSED_VERIFICATION, absent then
  optional bytes request_sha256 = 5 [json_name = "requestSha256"]; // validate: required unless REFUSED_VERIFICATION, absent then; 32 bytes, echoed
  optional bytes response_sha256 = 6 [json_name = "responseSha256"]; // validate: required for EXECUTED, absent otherwise; 32 bytes: SHA-256 of ChannelResult.payload
  optional uint32 response_size = 7 [json_name = "responseSize"]; // validate: required for EXECUTED, absent otherwise; 1..1,040,384; the payload's length
  arcforges.foundation.v1.Instant executed_at = 8 [json_name = "executedAt"]; // validate: required; when the node decided
  optional RoutedOutcome outcome = 9 [json_name = "outcome"]; // validate: required
  arcforges.foundation.v1.ArcError error = 10 [json_name = "error"]; // validate: required unless EXECUTED, absent then; the node's refusal as closed fields only (rule routedRefusal, below)
}

// ResultHeader.error, rule routedRefusal (Plan PN-6; review A B-1 and N-9). The refusal of a routed call holds closed identifier
// fields only, at most 512 bytes in all: no free text, only identifier tokens. A node can still place an identifier-shaped token
// (a hex string, a dotted name) in state or reason; the center therefore stores and audits only the category and code.
// - code: ^[a-z][a-z0-9_]{0,63}$, catalogued under this category (fixtures/public/af-con-01-error-catalogue.json); message_key
//   exactly error.<category>.<code> (the catalogue key);
// - category, retry mode, retry_at and effect as ArcError requires; reconciliation_operation absent, or exactly
//   arcforges.node.v1.ApprovalService/GetApproval (the RECONCILE advice of AUTHORIZATION/approval_required);
// - correlation_id as ArcError requires; it is the node's correlation, never part of a digest;
// - details absent or details.state only: state.state and state.reason match ^[a-z0-9_.]{1,64}$ (for example task.submit and
//   relay_own_node_only); state.native absent; state.resource absent, except for AUTHORIZATION/approval_required only, whose
//   resource is exactly {kind: "approval", id} (errors.md; Design 11 section 1: the approval ID that a local HUMAN decides);
// - details.revision, details.limit and details.upgrade refused; the whole error at most 512 bytes.
// The center never forwards the node's error bytes: it rebuilds the caller-facing ArcError of the routed method from these
// closed fields, with its own correlation ID, and stores or audits only the category and code (Plan PN-6).

// A routed result, node -> center. For EXECUTED, payload is the exact node.v1 TaskService response bytes, which the center
// forwards unchanged as the routed value's response; otherwise payload is empty and the center answers with an ArcError that it
// rebuilds from the closed fields of ResultHeader.error (rule routedRefusal), never with the node's error bytes.
message ChannelResult {
  arcforges.foundation.v1.Id call_id = 1 [json_name = "callId"]; // validate: required; equals ResultHeader.call_id
  SignedHeader header = 2 [json_name = "header"]; // validate: required; a ResultHeader under the routed-result domain string, without kid
  optional bytes payload = 3 [json_name = "payload"]; // validate: <= 1,040,384 bytes; empty unless EXECUTED
}

// A node asks for a relay nonce before it relays a local caller's call (Plan addendum C-N2): one nonce per call.
message RelayNonceRequest {
  arcforges.foundation.v1.Id request_id = 1 [json_name = "requestId"]; // validate: required; chosen by the node and echoed
}

// A relay nonce, center -> node: used once, by one relay assertion of this node; void at expires_at, or earlier when this
// connection closes or is replaced. Relaying therefore needs an open channel of the relaying node.
message RelayNonce {
  arcforges.foundation.v1.Id request_id = 1 [json_name = "requestId"]; // validate: required; RelayNonceRequest.request_id
  optional bytes nonce = 2 [json_name = "nonce"]; // validate: required; 32 random bytes
  arcforges.foundation.v1.Instant expires_at = 3 [json_name = "expiresAt"]; // validate: required; at most 120 s after issue
}

// The relay assertion of a node-relayed call (Plan addendum D0-B1, C-N1, C-N6; Design 11 section 1, "Relay assertion"). The
// relaying node signs the relay-origin domain string followed by the canonical bytes of these fields (see "Signatures of the
// node channel" above), and sends the serialized assertion as the relay_assertion bytes of the routed fleet.v1 request, which
// every node-relayed call carries, ListNodes and GetNode included. Before it serves or routes the call, the center verifies the
// signature against the key registered for the bearer credential's installation; checks that relaying_node_id and
// relaying_installation_id are that credential's enrolled node and installation, that the assertion has not expired and its
// nonce is unused (and then spends the nonce), and that method, request_sha256, target_node_id and command_id equal the routed
// request's and the request's caller its relaying_node_id and local_origin. Otherwise it refuses AUTHENTICATION/unauthenticated
// (state.state relay_assertion, state.reason missing, signature_invalid, credential_mismatch, expired, nonce_reused or
// request_mismatch) and routes nothing. For expired and nonce_reused the relaying node signs a new assertion with a fresh nonce
// and resends with the same command_id (DID_NOT_HAPPEN, SAME_COMMAND; no sign-in). The center fills the call header's caller
// only from a verified assertion.
// request_sha256: for the six routed task methods, SHA-256 of the exact node.v1 request bytes of the routed request's request
// field (the call header's request_sha256); for LIST_NODES and GET_NODE, SHA-256 of the routed request's top-level fields as
// transmitted, in wire order and byte for byte, with every occurrence of the relay_assertion field left out. That digest is
// defined over the binary protobuf encoding only: a node-relayed ListNodes or GetNode uses the binary codec (gRPC or binary
// gRPC-Web), the digest covers the message bytes after any transport decompression, and the center digests those received
// bytes, never a re-encoding of a decoded message; a relayed read in a JSON encoding is refused (request_mismatch) (review A N-1).
message RelayAssertion {
  arcforges.foundation.v1.Id relaying_node_id = 1 [json_name = "relayingNodeId"]; // validate: required
  arcforges.foundation.v1.Id relaying_installation_id = 2 [json_name = "relayingInstallationId"]; // validate: required
  optional arcforges.node.v1.Origin local_origin = 3 [json_name = "localOrigin"]; // validate: required; HUMAN, SCRIPT or AGENT, as the relaying node classified its local caller
  arcforges.foundation.v1.Id local_session_id = 4 [json_name = "localSessionId"]; // validate: required; the local caller's client session at the relaying node
  optional RoutedMethod method = 5 [json_name = "method"]; // validate: required; 1..8
  optional bytes request_sha256 = 6 [json_name = "requestSha256"]; // validate: required; 32 bytes
  arcforges.foundation.v1.Id target_node_id = 7 [json_name = "targetNodeId"]; // validate: absent for LIST_NODES, required otherwise
  arcforges.foundation.v1.Id command_id = 8 [json_name = "commandId"]; // validate: required for SUBMIT_NODE_TASK and CANCEL_NODE_TASK, absent otherwise
  optional bytes relay_nonce = 9 [json_name = "relayNonce"]; // validate: required; 32 bytes; a RelayNonce of the relaying node's open channel
  arcforges.foundation.v1.Instant issued_at = 10 [json_name = "issuedAt"]; // validate: required
  arcforges.foundation.v1.Instant expires_at = 11 [json_name = "expiresAt"]; // validate: required; issued_at < expires_at <= issued_at + 120 s
  optional bytes signature = 12 [json_name = "signature"]; // validate: required; 64 bytes, P1363, low-S
}

message NodeCursor {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional uint64 generation = 2 [json_name = "generation"];
  optional uint64 seq = 3 [json_name = "seq"];
}

message ViewerResume {
  repeated NodeCursor cursors = 1 [json_name = "cursors"];
}

message GrantRefresh {
  optional string grant = 1 [json_name = "grant"];
}

message ViewerReset {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional string reason = 2 [json_name = "reason"];
}

message ViewerFrame {
  optional uint32 frame_version = 1 [json_name = "frameVersion"]; // 1
  oneof frame {
    ViewerResume resume = 10 [json_name = "resume"]; // viewer -> DO
    GrantRefresh grant_refresh = 11 [json_name = "grantRefresh"]; // viewer -> DO
    arcforges.fleet.v1.NodeSnapshot snapshot = 12 [json_name = "snapshot"]; // DO -> viewer
    arcforges.fleet.v1.StatusDelta delta = 13 [json_name = "delta"]; // DO -> viewer
    arcforges.fleet.v1.NodePresence presence = 14 [json_name = "presence"]; // DO -> viewer
    ViewerReset reset = 15 [json_name = "reset"]; // DO -> viewer
    arcforges.fleet.v1.RemoteCommandView command_update = 16 [json_name = "commandUpdate"]; // DO -> viewer
    RelayClose close = 17 [json_name = "close"]; // DO -> viewer
    OutputTail output_tail = 18 [json_name = "outputTail"]; // DO -> viewer
  }
}

message CommandDeliver {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  arcforges.fleet.v1.SignedBlob command = 2 [json_name = "command"];
  arcforges.foundation.v1.Instant expires_at = 3 [json_name = "expiresAt"];
}

message CommandResultForward {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  arcforges.fleet.v1.SignedBlob result = 2 [json_name = "result"];
}

message CommandUndeliverable {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  optional string reason = 2 [json_name = "reason"]; // node_offline | expired | queue_full
}

message EventBatchForward {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  EventBatch batch = 2 [json_name = "batch"];
}

message PresenceChange {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional arcforges.fleet.v1.NodeOnlineState state = 2 [json_name = "state"];
  arcforges.foundation.v1.Instant at = 3 [json_name = "at"];
}

message UsageReport {
  arcforges.foundation.v1.Instant period_start = 1 [json_name = "periodStart"];
  optional uint32 frames_in = 2 [json_name = "framesIn"];
  optional uint32 frames_out = 3 [json_name = "framesOut"];
  optional uint64 bytes_in = 4 [json_name = "bytesIn"];
  optional uint64 bytes_out = 5 [json_name = "bytesOut"];
  optional uint32 wakes = 6 [json_name = "wakes"];
  optional uint32 viewers_peak = 7 [json_name = "viewersPeak"];
}

message KillSwitchUpdate {
  optional bool live_streaming = 1 [json_name = "liveStreaming"];
  optional bool new_connections = 2 [json_name = "newConnections"];
  optional bool commands = 3 [json_name = "commands"];
}

message HostEnvelope {
  optional uint32 envelope_version = 1 [json_name = "envelopeVersion"]; // 1
  arcforges.foundation.v1.Id account_id = 2 [json_name = "accountId"];
  oneof body {
    EventBatchForward events = 10 [json_name = "events"]; // DO -> C#
    CommandDeliver deliver = 11 [json_name = "deliver"]; // C# -> DO
    CommandResultForward result = 12 [json_name = "result"]; // DO -> C#
    PresenceChange presence = 13 [json_name = "presence"]; // DO -> C#
    UsageReport usage = 14 [json_name = "usage"]; // DO -> C#
    KillSwitchUpdate kill_switches = 15 [json_name = "killSwitches"]; // C# -> DO
    CommandUndeliverable undeliverable = 16 [json_name = "undeliverable"]; // DO -> C#
  }
}