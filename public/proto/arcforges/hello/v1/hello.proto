syntax = "proto3";

package arcforges.hello.v1;

option csharp_namespace = "ArcForges.Contracts.Hello.V1";

// Packaging and transport demonstration, not a product API.
service HelloService {
  // Returns "Hello, <name>!". An empty name returns INVALID_ARGUMENT.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
}
