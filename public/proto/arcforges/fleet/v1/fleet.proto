option csharp_namespace = "ArcForges.Contracts.Fleet.V1";
option java_package = "io.github.arcforges.contracts.fleet.v1";
option java_multiple_files = true;
option java_outer_classname = "FleetProto";

// Cloud API for nodes, viewers and stores (public; binary gRPC-Web through the Worker ingress to the C# host).
// Architecture 10; decisions AD-0009, AD-0010, AD-0011. State machines: SM-SIGN-IN, SM-DEVICE-AUTH,
// SM-PHONE-PAIRING, SM-RELAY, SM-REMOTE-COMMAND, SM-SUBSCRIPTION.
// Caller credentials: `account` session (web, Android, reused Identity), `node` credential (enrolled node),
// or none (only where stated). Step-up is the reused Identity step-up (passkey or recent authentication).

// Node sign-in (browser and device code), phone pairing, credentials, certificates, LAN hints and entitlement tokens.
service NodeEnrollmentService {
  // Start a PKCE loopback sign-in for a node (10 section 3.1).
  // auth: none (rate limited per IP and per node ID)
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: VALIDATION/invalid_argument, RESOURCE/rate_limited, RESOURCE/kill_switch_active
  // locality: cloud
  // state: SM-SIGN-IN: (none) -> PENDING
  rpc BeginNodeSignIn(NodeEnrollmentServiceBeginNodeSignInRequest) returns (NodeEnrollmentServiceBeginNodeSignInResponse);

  // Web consent page: show which node asks to connect.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, STATE/expired
  // locality: cloud
  rpc GetNodeSignInFlow(NodeEnrollmentServiceGetNodeSignInFlowRequest) returns (NodeEnrollmentServiceGetNodeSignInFlowResponse);

  // Web consent decision. On approval returns the loopback redirect with a one-use code.
  // auth: account session
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, STATE/expired, STATE/invalid_state, ENTITLEMENT/plan_limit_reached
  // locality: cloud
  // state: SM-SIGN-IN: PENDING -> APPROVED | DENIED
  rpc ApproveNodeSignIn(NodeEnrollmentServiceApproveNodeSignInRequest) returns (NodeEnrollmentServiceApproveNodeSignInResponse);

  // Exchange the code and verifier for node credentials; registers the NODE installation.
  // auth: none (flow-bound proof)
  // idempotency: natural: code single use; reuse revokes the flow
  // deadline: 15 s
  // stream: none
  // errors: STATE/not_found, STATE/expired, CONFLICT/code_reused, AUTHENTICATION/unauthenticated, VALIDATION/invalid_argument
  // locality: cloud
  // state: SM-SIGN-IN: APPROVED -> COMPLETED | REVOKED
  rpc CompleteNodeSignIn(NodeEnrollmentServiceCompleteNodeSignInRequest) returns (NodeEnrollmentServiceCompleteNodeSignInResponse);

  // Start a device-code sign-in for headless nodes (10 section 3.2).
  // auth: none (rate limited)
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: VALIDATION/invalid_argument, RESOURCE/rate_limited, RESOURCE/kill_switch_active
  // locality: cloud
  // state: SM-DEVICE-AUTH: (none) -> PENDING
  rpc StartDeviceAuthorization(NodeEnrollmentServiceStartDeviceAuthorizationRequest) returns (NodeEnrollmentServiceStartDeviceAuthorizationResponse);

  // Poll at the given interval. APPROVED returns credentials.
  // auth: none (device_code proof)
  // idempotency: natural
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, RESOURCE/rate_limited
  // locality: cloud
  // state: SM-DEVICE-AUTH: PENDING -> APPROVED -> COMPLETED; PENDING -> DENIED | EXPIRED
  rpc PollDeviceAuthorization(NodeEnrollmentServicePollDeviceAuthorizationRequest) returns (NodeEnrollmentServicePollDeviceAuthorizationResponse);

  // Web /activate: show the node behind a user code (5 entry attempts per code).
  // auth: account session
  // idempotency: read (counts an attempt)
  // deadline: 5 s
  // stream: none
  // errors: VALIDATION/code_invalid, STATE/expired, RESOURCE/rate_limited
  // locality: cloud
  rpc LookupDeviceCode(NodeEnrollmentServiceLookupDeviceCodeRequest) returns (NodeEnrollmentServiceLookupDeviceCodeResponse);

  // Web /activate decision.
  // auth: account session
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: VALIDATION/code_invalid, STATE/expired, ENTITLEMENT/plan_limit_reached
  // locality: cloud
  rpc ApproveDeviceCode(NodeEnrollmentServiceApproveDeviceCodeRequest) returns (NodeEnrollmentServiceApproveDeviceCodeResponse);

  // Rotate the node refresh token and obtain an access token.
  // auth: node refresh token
  // idempotency: natural: rotation with reuse detection (reuse revokes the credential)
  // deadline: 10 s
  // stream: none
  // errors: AUTHENTICATION/token_expired, AUTHENTICATION/credential_revoked
  // locality: cloud
  rpc RefreshNodeSession(NodeEnrollmentServiceRefreshNodeSessionRequest) returns (NodeEnrollmentServiceRefreshNodeSessionResponse);

  // Update the registry after a version, name or role change.
  // auth: node credential
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: AUTHENTICATION/unauthenticated, VALIDATION/invalid_argument
  // locality: cloud
  rpc ReportNodeInfo(NodeEnrollmentServiceReportNodeInfoRequest) returns (NodeEnrollmentServiceReportNodeInfoResponse);

  // Create a QR pairing so a phone can sign in as this account (10 section 3.3).
  // auth: node credential
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: AUTHENTICATION/unauthenticated, RESOURCE/rate_limited
  // locality: cloud
  // state: SM-PHONE-PAIRING: (none) -> WAITING_FOR_SCAN
  rpc CreatePhonePairing(NodeEnrollmentServiceCreatePhonePairingRequest) returns (NodeEnrollmentServiceCreatePhonePairingResponse);

  // Called by the phone after scanning. A wrong secret consumes the pairing.
  // auth: none (secret proof)
  // idempotency: natural: single claim
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, STATE/expired, STATE/invalid_state, RESOURCE/rate_limited
  // locality: cloud
  // state: SM-PHONE-PAIRING: WAITING_FOR_SCAN -> AWAITING_CONFIRMATION | CONSUMED
  rpc ClaimPhonePairing(NodeEnrollmentServiceClaimPhonePairingRequest) returns (NodeEnrollmentServiceClaimPhonePairingResponse);

  // The pairing node reads the state and the claiming phone's details.
  // auth: node credential
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: cloud
  rpc GetPhonePairing(NodeEnrollmentServiceGetPhonePairingRequest) returns (NodeEnrollmentServiceGetPhonePairingResponse);

  // The desktop user's decision, relayed by the node.
  // auth: node credential (HUMAN decision on the node)
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, STATE/invalid_state, STATE/expired
  // locality: cloud
  // state: SM-PHONE-PAIRING: AWAITING_CONFIRMATION -> CONFIRMED | DENIED
  rpc ConfirmPhonePairing(NodeEnrollmentServiceConfirmPhonePairingRequest) returns (NodeEnrollmentServiceConfirmPhonePairingResponse);

  // The phone polls; CONFIRMED returns its session credentials once.
  // auth: none (claim token proof)
  // idempotency: natural
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, STATE/expired, RESOURCE/rate_limited
  // locality: cloud
  // state: SM-PHONE-PAIRING: CONFIRMED -> COMPLETED
  rpc PollPhonePairing(NodeEnrollmentServicePollPhonePairingRequest) returns (NodeEnrollmentServicePollPhonePairingResponse);

  // Deferred (roadmap RM-01): issue or renew a 30-day account certificate for account-based LAN trust. Not served in release 1.
  // auth: node credential (deferred feature, roadmap RM-01)
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: VALIDATION/invalid_argument, AUTHENTICATION/credential_revoked
  // locality: cloud
  rpc IssueNodeCertificate(NodeEnrollmentServiceIssueNodeCertificateRequest) returns (NodeEnrollmentServiceIssueNodeCertificateResponse);

  // Deferred (roadmap RM-01): same-account nodes' last LAN endpoints and fingerprints. Not served in release 1.
  // auth: node credential (deferred feature, roadmap RM-01)
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc GetLanHints(NodeEnrollmentServiceGetLanHintsRequest) returns (NodeEnrollmentServiceGetLanHintsResponse);

  // Deferred (roadmap RM-01): report this node's LAN endpoints and fingerprint for hints. Not served in release 1.
  // auth: node credential
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: VALIDATION/invalid_argument
  // locality: cloud
  rpc ReportLanEndpoints(NodeEnrollmentServiceReportLanEndpointsRequest) returns (NodeEnrollmentServiceReportLanEndpointsResponse);

  // Signed entitlement token (refreshed every 24 h while online; 14-day validity).
  // auth: node credential
  // idempotency: read
  // deadline: 10 s
  // stream: none
  // errors: AUTHENTICATION/credential_revoked, AUTHENTICATION/token_expired
  // locality: cloud
  rpc RefreshEntitlementToken(NodeEnrollmentServiceRefreshEntitlementTokenRequest) returns (NodeEnrollmentServiceRefreshEntitlementTokenResponse);

  // Current public keys for entitlement tokens and command signatures.
  // auth: none
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc GetEntitlementKeys(NodeEnrollmentServiceGetEntitlementKeysRequest) returns (NodeEnrollmentServiceGetEntitlementKeysResponse);

  // Reserve a consented support-bundle upload for a case of the node's account. Returns a short-lived R2 upload URL bound to the size and SHA-256 (architecture 10 section 3.11).
  // auth: node credential; plan limit on support uploads per day
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, RESOURCE/rate_limited, RESOURCE/too_large, RESOURCE/kill_switch_active, VALIDATION/invalid_argument
  // locality: cloud
  rpc BeginSupportUpload(NodeEnrollmentServiceBeginSupportUploadRequest) returns (NodeEnrollmentServiceBeginSupportUploadResponse);

  // Confirm an upload: the host verifies the object's size and SHA-256 in R2, then attaches it to the case as a message with a diagnostic reference (expires after 30 days).
  // auth: node credential
  // idempotency: natural: completing a completed upload returns the same message
  // deadline: 20 s
  // stream: none
  // errors: STATE/not_found, STATE/expired, STATE/invalid_state
  // locality: cloud
  rpc CompleteSupportUpload(NodeEnrollmentServiceCompleteSupportUploadRequest) returns (NodeEnrollmentServiceCompleteSupportUploadResponse);
}

message NodeEnrollmentServiceBeginNodeSignInRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  optional string code_challenge = 10 [json_name = "codeChallenge"]; // validate: base64url SHA-256, 43 chars
  optional string redirect_uri = 11 [json_name = "redirectUri"]; // validate: http://127.0.0.1:<port>/callback or http://[::1]:<port>/callback
  EnrollingNodeInfo node = 12 [json_name = "node"]; // validate: required
}
message NodeEnrollmentServiceBeginNodeSignInResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceBeginNodeSignInValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceBeginNodeSignInValue {
  arcforges.foundation.v1.Id flow_id = 10 [json_name = "flowId"];
  optional string authorize_url = 11 [json_name = "authorizeUrl"]; // https://arcforges.com/connect?flow=<id>
  arcforges.foundation.v1.Instant expires_at = 12 [json_name = "expiresAt"]; // 10 minutes
}

message NodeEnrollmentServiceGetNodeSignInFlowRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id flow_id = 10 [json_name = "flowId"]; // validate: required
}
message NodeEnrollmentServiceGetNodeSignInFlowResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceGetNodeSignInFlowValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceGetNodeSignInFlowValue {
  NodeSignInFlowView flow = 10 [json_name = "flow"];
}

message NodeEnrollmentServiceApproveNodeSignInRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id flow_id = 10 [json_name = "flowId"]; // validate: PENDING
  optional bool approve = 11 [json_name = "approve"];
}
message NodeEnrollmentServiceApproveNodeSignInResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceApproveNodeSignInValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceApproveNodeSignInValue {
  optional string redirect_url = 10 [json_name = "redirectUrl"]; // loopback URI with code and state
  NodeSignInFlowView flow = 11 [json_name = "flow"];
}

message NodeEnrollmentServiceCompleteNodeSignInRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id flow_id = 10 [json_name = "flowId"]; // validate: APPROVED
  optional string code = 11 [json_name = "code"]; // validate: one use
  optional string code_verifier = 12 [json_name = "codeVerifier"]; // validate: 43..128 chars; matches the challenge
  optional bytes csr = 13 [json_name = "csr"]; // validate: optional; PKCS#10 DER, P-256, SAN URI arcforges:node:<node_id>; reserved for account-based LAN trust (roadmap RM-01) and ignored in release 1
}
message NodeEnrollmentServiceCompleteNodeSignInResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceCompleteNodeSignInValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceCompleteNodeSignInValue {
  NodeCredentials credentials = 10 [json_name = "credentials"];
}

message NodeEnrollmentServiceStartDeviceAuthorizationRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  EnrollingNodeInfo node = 10 [json_name = "node"]; // validate: required
}
message NodeEnrollmentServiceStartDeviceAuthorizationResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceStartDeviceAuthorizationValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceStartDeviceAuthorizationValue {
  DeviceAuthorization authorization = 10 [json_name = "authorization"];
}

message NodeEnrollmentServicePollDeviceAuthorizationRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  optional string device_code = 10 [json_name = "deviceCode"]; // validate: required
  optional bytes csr = 11 [json_name = "csr"]; // validate: optional; as in CompleteNodeSignIn (reserved for roadmap RM-01)
}
message NodeEnrollmentServicePollDeviceAuthorizationResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServicePollDeviceAuthorizationValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServicePollDeviceAuthorizationValue {
  optional DeviceAuthorizationState state = 10 [json_name = "state"];
  optional uint64 interval_ms = 11 [json_name = "intervalMs"];
  NodeCredentials credentials = 12 [json_name = "credentials"]; // APPROVED only
}

message NodeEnrollmentServiceLookupDeviceCodeRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  optional string user_code = 10 [json_name = "userCode"]; // validate: 8 characters from the code alphabet; separators ignored
}
message NodeEnrollmentServiceLookupDeviceCodeResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceLookupDeviceCodeValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceLookupDeviceCodeValue {
  EnrollingNodeInfo node = 10 [json_name = "node"];
}

message NodeEnrollmentServiceApproveDeviceCodeRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  optional string user_code = 10 [json_name = "userCode"]; // validate: as LookupDeviceCode
  optional bool approve = 11 [json_name = "approve"];
}
message NodeEnrollmentServiceApproveDeviceCodeResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceApproveDeviceCodeValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceApproveDeviceCodeValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
}

message NodeEnrollmentServiceRefreshNodeSessionRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  optional string refresh_token = 10 [json_name = "refreshToken"]; // validate: required
}
message NodeEnrollmentServiceRefreshNodeSessionResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceRefreshNodeSessionValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceRefreshNodeSessionValue {
  optional string refresh_token = 10 [json_name = "refreshToken"];
  optional string access_token = 11 [json_name = "accessToken"];
  arcforges.foundation.v1.Instant access_expires_at = 12 [json_name = "accessExpiresAt"];
}

message NodeEnrollmentServiceReportNodeInfoRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  EnrollingNodeInfo node = 10 [json_name = "node"]; // validate: node_id must match the credential
}
message NodeEnrollmentServiceReportNodeInfoResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceReportNodeInfoValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceReportNodeInfoValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
}

message NodeEnrollmentServiceCreatePhonePairingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
}
message NodeEnrollmentServiceCreatePhonePairingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceCreatePhonePairingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceCreatePhonePairingValue {
  PhonePairingTicket ticket = 10 [json_name = "ticket"];
}

message NodeEnrollmentServiceClaimPhonePairingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id pairing_id = 10 [json_name = "pairingId"]; // validate: required
  optional string secret = 11 [json_name = "secret"]; // validate: required
  PhoneInstallationInfo phone = 12 [json_name = "phone"]; // validate: required
}
message NodeEnrollmentServiceClaimPhonePairingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceClaimPhonePairingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceClaimPhonePairingValue {
  PhonePairingView pairing = 10 [json_name = "pairing"];
  optional string claim_token = 11 [json_name = "claimToken"]; // for PollPhonePairing
}

message NodeEnrollmentServiceGetPhonePairingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id pairing_id = 10 [json_name = "pairingId"]; // validate: created by this node
}
message NodeEnrollmentServiceGetPhonePairingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceGetPhonePairingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceGetPhonePairingValue {
  PhonePairingView pairing = 10 [json_name = "pairing"];
}

message NodeEnrollmentServiceConfirmPhonePairingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id pairing_id = 10 [json_name = "pairingId"]; // validate: AWAITING_CONFIRMATION
  optional bool approve = 11 [json_name = "approve"];
}
message NodeEnrollmentServiceConfirmPhonePairingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServiceConfirmPhonePairingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServiceConfirmPhonePairingValue {
  PhonePairingView pairing = 10 [json_name = "pairing"];
}

message NodeEnrollmentServicePollPhonePairingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id pairing_id = 10 [json_name = "pairingId"]; // validate: required
  optional string claim_token = 11 [json_name = "claimToken"]; // validate: from ClaimPhonePairing
}
message NodeEnrollmentServicePollPhonePairingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    NodeEnrollmentServicePollPhonePairingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message NodeEnrollmentServicePollPhonePairingValue {
  PhonePairingView pairing = 10 [json_name = "pairing"];
  MobileSessionCredentials credentials = 11 [json_name = "credentials"]; // CONFIRMED only, scope LIMITED; the pairing becomes COMPLETED
}

