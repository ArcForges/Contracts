// SM-DEVICE-AUTH states. SLOW_DOWN is a poll response only, never a stored state.
enum DeviceAuthorizationState {
  DEVICE_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  DEVICE_AUTHORIZATION_STATE_PENDING = 1;
  DEVICE_AUTHORIZATION_STATE_SLOW_DOWN = 2;
  DEVICE_AUTHORIZATION_STATE_APPROVED = 3;
  DEVICE_AUTHORIZATION_STATE_DENIED = 4;
  DEVICE_AUTHORIZATION_STATE_EXPIRED = 5;
  DEVICE_AUTHORIZATION_STATE_COMPLETED = 6; // credentials already delivered
}

// SM-SIGN-IN states (cloud side).
enum NodeSignInState {
  NODE_SIGN_IN_STATE_UNSPECIFIED = 0;
  NODE_SIGN_IN_STATE_PENDING = 1;
  NODE_SIGN_IN_STATE_APPROVED = 2;
  NODE_SIGN_IN_STATE_COMPLETED = 3;
  NODE_SIGN_IN_STATE_DENIED = 4;
  NODE_SIGN_IN_STATE_EXPIRED = 5;
  NODE_SIGN_IN_STATE_REVOKED = 6; // code reuse detected
}

// SM-PHONE-PAIRING states (cloud side).
enum PhonePairingCloudState {
  PHONE_PAIRING_CLOUD_STATE_UNSPECIFIED = 0;
  PHONE_PAIRING_CLOUD_STATE_WAITING_FOR_SCAN = 1;
  PHONE_PAIRING_CLOUD_STATE_AWAITING_CONFIRMATION = 2;
  PHONE_PAIRING_CLOUD_STATE_CONFIRMED = 3;
  PHONE_PAIRING_CLOUD_STATE_DENIED = 4;
  PHONE_PAIRING_CLOUD_STATE_EXPIRED = 5;
  PHONE_PAIRING_CLOUD_STATE_COMPLETED = 6;
  PHONE_PAIRING_CLOUD_STATE_CONSUMED = 7; // wrong secret presented
}

enum SubscriptionSource {
  SUBSCRIPTION_SOURCE_UNSPECIFIED = 0;
  SUBSCRIPTION_SOURCE_PADDLE = 1;
  SUBSCRIPTION_SOURCE_GOOGLE_PLAY = 2;
  SUBSCRIPTION_SOURCE_OPERATOR_GRANT = 3;
}

// SM-SUBSCRIPTION states (normalized across sources; architecture 14 section 3).
enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_TRIALING = 2;
  SUBSCRIPTION_STATE_PAYMENT_ISSUE = 3; // Paddle past_due, Play grace period
  SUBSCRIPTION_STATE_ON_HOLD = 4;
  SUBSCRIPTION_STATE_PAUSED = 5;
  SUBSCRIPTION_STATE_CANCELED_ACTIVE = 6; // ends at period end
  SUBSCRIPTION_STATE_EXPIRED = 7;
  SUBSCRIPTION_STATE_PENDING = 8;
  SUBSCRIPTION_STATE_REVOKED = 9; // refund, chargeback, voided purchase
}

enum PlayLinkState {
  PLAY_LINK_STATE_UNSPECIFIED = 0;
  PLAY_LINK_STATE_LINKED = 1;
  PLAY_LINK_STATE_NEEDS_CONFIRMATION = 2;
  PLAY_LINK_STATE_LINKED_TO_OTHER_ACCOUNT = 3;
  PLAY_LINK_STATE_INVALID = 4;
  PLAY_LINK_STATE_PENDING_PAYMENT = 5;
}

message EnrollingNodeInfo {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"]; // validate: required; 16 bytes
  optional string name = 2 [json_name = "name"]; // validate: 1..64 chars
  optional arcforges.node.v1.OsFamily os = 3 [json_name = "os"]; // validate: required
  optional arcforges.node.v1.CpuArchitecture arch = 4 [json_name = "arch"]; // validate: required
  optional string version = 5 [json_name = "version"]; // validate: SemVer
  optional arcforges.node.v1.NodeRole role = 6 [json_name = "role"];
  arcforges.foundation.v1.Id host_node_id = 7 [json_name = "hostNodeId"]; // validate: GUEST only
}

message AccountSummary {
  arcforges.foundation.v1.Id account_id = 1 [json_name = "accountId"];
  optional string display_name = 2 [json_name = "displayName"];
  optional string email_masked = 3 [json_name = "emailMasked"];
  optional string plan = 4 [json_name = "plan"];
}

message PublicKey {
  optional string kid = 1 [json_name = "kid"];
  optional string algorithm = 2 [json_name = "algorithm"]; // "ES256" (ECDSA P-256 with SHA-256)
  optional bytes key = 3 [json_name = "key"];
  arcforges.foundation.v1.Instant not_before = 4 [json_name = "notBefore"];
  arcforges.foundation.v1.Instant not_after = 5 [json_name = "notAfter"];
}

// A detached-signature container: payload is a serialized message, signature covers payload bytes.
message SignedBlob {
  optional bytes payload = 1 [json_name = "payload"];
  optional bytes signature = 2 [json_name = "signature"]; // IEEE P1363 r||s (64 bytes)
  optional string kid = 3 [json_name = "kid"];
  optional string algorithm = 4 [json_name = "algorithm"]; // "ES256" for cloud keys and node keys
}

// Payload of the entitlement token (SignedBlob, ES256).
message EntitlementClaims {
  arcforges.foundation.v1.Id account_id = 1 [json_name = "accountId"];
  arcforges.foundation.v1.Id node_id = 2 [json_name = "nodeId"];
  optional string plan = 3 [json_name = "plan"];
  repeated string features = 4 [json_name = "features"];
  arcforges.foundation.v1.Instant issued_at = 5 [json_name = "issuedAt"];
  arcforges.foundation.v1.Instant not_after = 6 [json_name = "notAfter"]; // issued_at + 14 days
  repeated arcforges.foundation.v1.Id revoked_nodes = 7 [json_name = "revokedNodes"]; // <= 256, delta since the node's last token; for account-based LAN trust (roadmap RM-01), empty in release 1
  optional int64 entitlement_version = 8 [json_name = "entitlementVersion"];
}

message NodeCredentials {
  optional string refresh_token = 1 [json_name = "refreshToken"]; // scope node; 90-day sliding; stored in the OS secret store
  optional string access_token = 2 [json_name = "accessToken"]; // 15 minutes
  arcforges.foundation.v1.Instant access_expires_at = 3 [json_name = "accessExpiresAt"];
  AccountSummary account = 4 [json_name = "account"];
  SignedBlob entitlement_token = 5 [json_name = "entitlementToken"];
  repeated bytes node_certificate_chain = 6 [json_name = "nodeCertificateChain"]; // DER; account-based LAN trust (roadmap RM-01): absent in release 1
  repeated PublicKey command_keys = 7 [json_name = "commandKeys"];
  repeated PublicKey entitlement_keys = 8 [json_name = "entitlementKeys"];
  arcforges.foundation.v1.Id installation_id = 9 [json_name = "installationId"];
}

enum MobileSessionScope {
  MOBILE_SESSION_SCOPE_UNSPECIFIED = 0;
  MOBILE_SESSION_SCOPE_LIMITED = 1; // fleet view, push registration, low-risk commands; obtained by QR pairing
  MOBILE_SESSION_SCOPE_ACCOUNT = 2; // full account session after a step-up on the phone (passkey or e-mail code)
}

message MobileSessionCredentials {
  optional string refresh_token = 1 [json_name = "refreshToken"]; // Identity native-bearer session; product arcforges-mobile
  optional string access_token = 2 [json_name = "accessToken"];
  arcforges.foundation.v1.Instant access_expires_at = 3 [json_name = "accessExpiresAt"];
  AccountSummary account = 4 [json_name = "account"];
  arcforges.foundation.v1.Id installation_id = 5 [json_name = "installationId"];
  optional MobileSessionScope scope = 6 [json_name = "scope"];
}

message NodeSignInFlowView {
  arcforges.foundation.v1.Id flow_id = 1 [json_name = "flowId"];
  EnrollingNodeInfo node = 2 [json_name = "node"];
  optional NodeSignInState state = 3 [json_name = "state"];
  arcforges.foundation.v1.Instant created_at = 4 [json_name = "createdAt"];
  arcforges.foundation.v1.Instant expires_at = 5 [json_name = "expiresAt"];
}

message DeviceAuthorization {
  optional string device_code = 1 [json_name = "deviceCode"]; // 32 bytes base64url; node-held secret
  optional string user_code = 2 [json_name = "userCode"]; // 8 characters from BCDFGHJKLMNPQRSTVWXZ, shown as XXXX-XXXX
  optional string verification_uri = 3 [json_name = "verificationUri"]; // https://arcforges.com/activate
  optional string verification_uri_complete = 4 [json_name = "verificationUriComplete"];
  optional uint64 interval_ms = 5 [json_name = "intervalMs"]; // 5,000; grows by 5,000 on SLOW_DOWN
  arcforges.foundation.v1.Instant expires_at = 6 [json_name = "expiresAt"]; // 600 s
}

message PhoneInstallationInfo {
  arcforges.foundation.v1.Id installation_id = 1 [json_name = "installationId"]; // validate: generated by the app at first start
  optional string model = 2 [json_name = "model"]; // validate: <= 64 chars
  optional string os_version = 3 [json_name = "osVersion"]; // validate: <= 32 chars
  optional string app_version = 4 [json_name = "appVersion"]; // validate: SemVer
}

message PhonePairingTicket {
  arcforges.foundation.v1.Id pairing_id = 1 [json_name = "pairingId"];
  optional string secret = 2 [json_name = "secret"]; // 32 random bytes base32
  optional string qr_payload = 3 [json_name = "qrPayload"]; // arcforges://pair?i=<pairing_id>&s=<secret>
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"]; // 120 s
}

message PhonePairingView {
  arcforges.foundation.v1.Id pairing_id = 1 [json_name = "pairingId"];
  optional PhonePairingCloudState state = 2 [json_name = "state"];
  PhoneInstallationInfo phone = 3 [json_name = "phone"];
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"];
}

message LanHint {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional string name = 2 [json_name = "name"];
  repeated string endpoints = 3 [json_name = "endpoints"]; // host:port last reported by the node
  optional string fingerprint = 4 [json_name = "fingerprint"];
  arcforges.foundation.v1.Instant reported_at = 5 [json_name = "reportedAt"];
}

// Bounded node status for the relay and viewers (<= 4 KiB serialized; D1 data only).
message StatusSummary {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional uint64 generation = 2 [json_name = "generation"];
  optional uint64 seq = 3 [json_name = "seq"];
  arcforges.foundation.v1.Instant at = 4 [json_name = "at"];
  optional arcforges.node.v1.NodeLifecycleState state = 5 [json_name = "state"];
  optional string version = 6 [json_name = "version"];
  optional uint32 running = 7 [json_name = "running"];
  optional uint32 queued = 8 [json_name = "queued"];
  optional uint32 budget_cpu_millicores = 9 [json_name = "budgetCpuMillicores"];
  optional uint64 budget_mem_bytes = 10 [json_name = "budgetMemBytes"];
  optional uint32 cpu_used_percent = 11 [json_name = "cpuUsedPercent"];
  optional uint32 mem_used_percent = 12 [json_name = "memUsedPercent"];
  optional arcforges.node.v1.PressureLevel pressure = 13 [json_name = "pressure"];
  optional uint32 findings_warning = 14 [json_name = "findingsWarning"];
  optional uint32 findings_error = 15 [json_name = "findingsError"];
  optional uint32 approvals_pending = 16 [json_name = "approvalsPending"];
  optional arcforges.node.v1.CpuControl cpu_control = 17 [json_name = "cpuControl"];
  optional arcforges.node.v1.MemoryControl memory_control = 18 [json_name = "memoryControl"];
  optional arcforges.node.v1.UpdateState update_state = 19 [json_name = "updateState"];
  optional string name = 20 [json_name = "name"];
  optional uint64 disk_free_bytes = 21 [json_name = "diskFreeBytes"]; // the data-root volume
  optional uint64 disk_total_bytes = 22 [json_name = "diskTotalBytes"];
  optional arcforges.node.v1.DiskPressureLevel disk_level = 23 [json_name = "diskLevel"]; // worst level of the volumes holding managed roots
  optional uint64 managed_storage_bytes = 24 [json_name = "managedStorageBytes"]; // sum of the managed roots
  optional uint32 sessions_active = 25 [json_name = "sessionsActive"];
  optional uint32 subagents_active = 26 [json_name = "subagentsActive"];
}

message TaskSummary {
  arcforges.foundation.v1.Id task_id = 1 [json_name = "taskId"];
  optional string title = 2 [json_name = "title"];
  optional arcforges.node.v1.TaskState state = 3 [json_name = "state"];
  optional string pool = 4 [json_name = "pool"];
  optional arcforges.node.v1.Priority priority = 5 [json_name = "priority"];
  arcforges.foundation.v1.Instant started_at = 6 [json_name = "startedAt"];
  arcforges.foundation.v1.Instant finished_at = 7 [json_name = "finishedAt"];
  optional string category = 8 [json_name = "category"];
  optional arcforges.node.v1.Origin owner_origin = 9 [json_name = "ownerOrigin"];
  optional string client = 10 [json_name = "client"]; // claude-code | codex | cli | desktop
  optional int32 exit_code = 11 [json_name = "exitCode"];
  optional uint32 progress_percent = 12 [json_name = "progressPercent"];
  arcforges.foundation.v1.Id session_id = 13 [json_name = "sessionId"]; // owner session, when there is one
  optional string subagent = 14 [json_name = "subagent"]; // agent type when attribution is known; absent = none or unknown (see attribution)
  optional arcforges.node.v1.TerminationReason termination_reason = 15 [json_name = "terminationReason"];
  repeated CategoryShare timeline = 16 [json_name = "timeline"]; // up to 6 categories with the most time
  optional uint32 queue_position = 17 [json_name = "queuePosition"];
  optional string blocking_reason = 18 [json_name = "blockingReason"]; // values as node.v1.QueueInfo.blocking_reason
  arcforges.foundation.v1.Instant eta = 19 [json_name = "eta"];
  optional uint64 elapsed_ms = 20 [json_name = "elapsedMs"];
  optional string attribution = 21 [json_name = "attribution"]; // KNOWN | NONE | UNKNOWN (for example MCP work of a subagent)
}

message CategoryShare {
  optional string category = 1 [json_name = "category"]; // timeline category (07 section 1)
  optional uint64 seconds = 2 [json_name = "seconds"];
}

message FindingSummary {
  arcforges.foundation.v1.Id finding_id = 1 [json_name = "findingId"];
  optional string kind = 2 [json_name = "kind"];
  optional arcforges.node.v1.Severity severity = 3 [json_name = "severity"];
  optional string title = 4 [json_name = "title"];
  optional string subject_kind = 5 [json_name = "subjectKind"];
  optional arcforges.node.v1.FindingState state = 6 [json_name = "state"];
}

message ApprovalSummary {
  arcforges.foundation.v1.Id approval_id = 1 [json_name = "approvalId"];
  optional string operation = 2 [json_name = "operation"];
  optional string summary = 3 [json_name = "summary"];
  optional arcforges.node.v1.RiskClass risk = 4 [json_name = "risk"];
  arcforges.foundation.v1.Instant created_at = 5 [json_name = "createdAt"];
  arcforges.foundation.v1.Instant expires_at = 6 [json_name = "expiresAt"];
  optional arcforges.node.v1.Origin requester_origin = 7 [json_name = "requesterOrigin"];
}

message SessionSummary {
  arcforges.foundation.v1.Id session_id = 1 [json_name = "sessionId"];
  optional string client = 2 [json_name = "client"];
  optional arcforges.node.v1.SessionState state = 3 [json_name = "state"];
  optional uint32 managed_tasks = 4 [json_name = "managedTasks"];
  optional uint32 bypassed_commands = 5 [json_name = "bypassedCommands"];
  optional string workspace_name = 6 [json_name = "workspaceName"]; // the repository or folder name only, never a path
  optional uint32 subagents_active = 7 [json_name = "subagentsActive"];
  repeated SubagentSummary subagents = 8 [json_name = "subagents"]; // FULL detail only
  optional string last_event_kind = 9 [json_name = "lastEventKind"]; // the last client-reported event, for example "PreToolUse"
  arcforges.foundation.v1.Instant last_event_at = 10 [json_name = "lastEventAt"];
  optional bool mcp_connected = 11 [json_name = "mcpConnected"];
  optional arcforges.node.v1.RoutingMode routing_mode = 12 [json_name = "routingMode"]; // effective
  optional uint32 managed_share_permille = 13 [json_name = "managedSharePermille"]; // as node.v1.SessionCoverage
  repeated string unknowns = 14 [json_name = "unknowns"]; // what this client cannot report, for example "model state (never available)"
}

message SubagentSummary {
  optional string agent_type = 1 [json_name = "agentType"];
  optional string state = 2 [json_name = "state"]; // RUNNING | STOPPED (client-reported)
  arcforges.foundation.v1.Instant started_at = 3 [json_name = "startedAt"];
  optional uint32 managed_tasks = 4 [json_name = "managedTasks"]; // tasks attributed to this subagent; MCP work of subagents is attributed to the session
}

message StatusDelta {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional uint64 generation = 2 [json_name = "generation"];
  optional uint64 seq = 3 [json_name = "seq"];
  arcforges.foundation.v1.Instant at = 4 [json_name = "at"];
  StatusSummary summary = 5 [json_name = "summary"];
  repeated TaskSummary upserted_tasks = 6 [json_name = "upsertedTasks"];
  repeated arcforges.foundation.v1.Id removed_task_ids = 7 [json_name = "removedTaskIds"];
  repeated FindingSummary findings = 8 [json_name = "findings"];
  repeated ApprovalSummary approvals = 9 [json_name = "approvals"];
  repeated SessionSummary sessions = 10 [json_name = "sessions"];
}

message NodeSnapshot {
  StatusSummary summary = 1 [json_name = "summary"];
  repeated TaskSummary tasks = 2 [json_name = "tasks"]; // active plus the 50 most recent
  repeated FindingSummary findings = 3 [json_name = "findings"]; // open
  repeated ApprovalSummary approvals = 4 [json_name = "approvals"]; // pending
  repeated SessionSummary sessions = 5 [json_name = "sessions"]; // active
}

message FleetNode {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional string name = 2 [json_name = "name"];
  optional arcforges.node.v1.OsFamily os = 3 [json_name = "os"];
  optional arcforges.node.v1.CpuArchitecture arch = 4 [json_name = "arch"];
  optional string version = 5 [json_name = "version"];
  optional arcforges.node.v1.NodeRole role = 6 [json_name = "role"];
  arcforges.foundation.v1.Id host_node_id = 7 [json_name = "hostNodeId"];
  optional NodeOnlineState online = 8 [json_name = "online"];
  arcforges.foundation.v1.Instant last_seen_at = 9 [json_name = "lastSeenAt"];
  arcforges.foundation.v1.Instant enrolled_at = 10 [json_name = "enrolledAt"];
  StatusSummary summary = 11 [json_name = "summary"]; // cached by the relay; absent when never connected
  optional bool relay_enabled = 12 [json_name = "relayEnabled"];
  arcforges.foundation.v1.Id device_id = 13 [json_name = "deviceId"]; // the node's own device record (publicapi.v1.DeviceService)
}

// Commands a viewer may send to a node (AD-0009 section 5). Risk is fixed per kind.
message NodeCommandBody {
  oneof kind {
    RefreshStatusCommand refresh = 1 [json_name = "refresh"]; // LOW
    PauseQueueCommand pause_queue = 2 [json_name = "pauseQueue"]; // LOW
    ResumeQueueCommand resume_queue = 3 [json_name = "resumeQueue"]; // LOW
    CancelTaskCommand cancel_task = 4 [json_name = "cancelTask"]; // MEDIUM
    SetPriorityCommand set_priority = 5 [json_name = "setPriority"]; // MEDIUM
    RunTaskCommand run_task = 6 [json_name = "runTask"]; // HIGH
    DecideApprovalCommand decide_approval = 7 [json_name = "decideApproval"]; // HIGH; node policy remote.allow_approvals
    ReadOutputTailCommand read_output_tail = 8 [json_name = "readOutputTail"]; // LOW; node privacy policy remote_output_tail
    ApplyUpdateCommand apply_update = 9 [json_name = "applyUpdate"]; // HIGH
    SetParallelismCommand set_parallelism = 10 [json_name = "setParallelism"]; // HIGH
    StopNodeCommand stop_node = 11 [json_name = "stopNode"]; // HIGH
  }
}

message RefreshStatusCommand {
  optional DetailLevel detail = 1 [json_name = "detail"];
}

message PauseQueueCommand {
  optional string pool = 1 [json_name = "pool"]; // validate: empty = all pools
}

message ResumeQueueCommand {
  optional string pool = 1 [json_name = "pool"]; // validate: empty = all pools
}

message CancelTaskCommand {
  arcforges.foundation.v1.Id task_id = 1 [json_name = "taskId"]; // validate: required
  optional string reason = 2 [json_name = "reason"]; // validate: <= 200 chars
}

message SetPriorityCommand {
  arcforges.foundation.v1.Id task_id = 1 [json_name = "taskId"]; // validate: required
  optional arcforges.node.v1.Priority priority = 2 [json_name = "priority"]; // validate: not INTERACTIVE
}

message RunTaskCommand {
  arcforges.node.v1.TaskSpec spec = 1 [json_name = "spec"]; // validate: argv form only; working_directory inside a registered workspace; inherit = NODE
}

message DecideApprovalCommand {
  arcforges.foundation.v1.Id approval_id = 1 [json_name = "approvalId"]; // validate: required
  optional bool approve = 2 [json_name = "approve"];
  optional string comment = 3 [json_name = "comment"]; // validate: <= 500 chars
}

message ReadOutputTailCommand {
  arcforges.foundation.v1.Id task_id = 1 [json_name = "taskId"]; // validate: required
  optional uint32 max_bytes = 2 [json_name = "maxBytes"]; // validate: 1..65,536; default 16,384
}

message ApplyUpdateCommand {
  optional string expected_version = 1 [json_name = "expectedVersion"]; // validate: the staged version shown to the user
}

message SetParallelismCommand {
  optional arcforges.node.v1.ParallelismScope scope = 1 [json_name = "scope"];
  optional string target = 2 [json_name = "target"];
  optional arcforges.node.v1.ParallelismMode mode = 3 [json_name = "mode"];
  optional uint32 fixed = 4 [json_name = "fixed"];
}

message StopNodeCommand {
  optional bool cancel_running = 1 [json_name = "cancelRunning"];
}

// Payload of the signed command envelope (SignedBlob, ES256, cloud command key).
message NodeCommand {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  arcforges.foundation.v1.Id account_id = 2 [json_name = "accountId"];
  arcforges.foundation.v1.Id node_id = 3 [json_name = "nodeId"];
  arcforges.foundation.v1.Instant issued_at = 4 [json_name = "issuedAt"];
  arcforges.foundation.v1.Instant expires_at = 5 [json_name = "expiresAt"]; // <= issued_at + 5 min
  optional arcforges.node.v1.RiskClass risk = 6 [json_name = "risk"];
  arcforges.foundation.v1.Id actor_user_id = 7 [json_name = "actorUserId"];
  arcforges.foundation.v1.Instant step_up_at = 8 [json_name = "stepUpAt"];
  optional string actor_device = 9 [json_name = "actorDevice"];
  NodeCommandBody body = 10 [json_name = "body"];
}

// Payload of the signed result (SignedBlob, ES256, node key).
message NodeCommandResult {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  arcforges.foundation.v1.Id node_id = 2 [json_name = "nodeId"];
  arcforges.foundation.v1.Instant executed_at = 3 [json_name = "executedAt"];
  oneof outcome {
    arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
    arcforges.foundation.v1.ArcError error = 11 [json_name = "error"];
  }
  optional bytes output_tail_sha256 = 20 [json_name = "outputTailSha256"]; // ReadOutputTail only; the tail travels in relay OutputTail frames and is never stored
  optional string detail = 21 [json_name = "detail"];
  optional uint32 output_tail_bytes = 22 [json_name = "outputTailBytes"];
}

message RemoteCommandView {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  arcforges.foundation.v1.Id node_id = 2 [json_name = "nodeId"];
  optional string kind = 3 [json_name = "kind"];
  optional arcforges.node.v1.RiskClass risk = 4 [json_name = "risk"];
  optional RemoteCommandState state = 5 [json_name = "state"];
  arcforges.foundation.v1.Instant created_at = 6 [json_name = "createdAt"];
  arcforges.foundation.v1.Instant expires_at = 7 [json_name = "expiresAt"];
  arcforges.foundation.v1.Instant delivered_at = 8 [json_name = "deliveredAt"];
  arcforges.foundation.v1.Instant completed_at = 9 [json_name = "completedAt"];
  NodeCommandResult result = 10 [json_name = "result"];
  optional string actor_display = 11 [json_name = "actorDisplay"];
}

message RelayTokenGrant {
  optional string token = 1 [json_name = "token"]; // base64url(claims).base64url(mac)
  arcforges.foundation.v1.Instant expires_at = 2 [json_name = "expiresAt"]; // 15 minutes
  optional string relay_url = 3 [json_name = "relayUrl"]; // wss://relay.arcforges.com/v1/node
}

message ViewerGrant {
  optional string grant = 1 [json_name = "grant"]; // base64url(claims).base64url(mac)
  arcforges.foundation.v1.Instant expires_at = 2 [json_name = "expiresAt"]; // 10 minutes
  optional string ws_url = 3 [json_name = "wsUrl"]; // wss://relay.arcforges.com/v1/view
}

message NodePresence {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional NodeOnlineState state = 2 [json_name = "state"];
  arcforges.foundation.v1.Instant at = 3 [json_name = "at"];
}

message PushPreference {
  optional string kind = 1 [json_name = "kind"]; // validate: node.task_failed | node.task_finished | node.approval_needed | node.offline | node.finding
  arcforges.foundation.v1.Id node_id = 2 [json_name = "nodeId"]; // absent = all nodes
  optional bool enabled = 3 [json_name = "enabled"];
}

message PushPreferences {
  repeated PushPreference preferences = 1 [json_name = "preferences"]; // validate: <= 200 entries
  optional uint32 daily_limit = 2 [json_name = "dailyLimit"]; // read-only plan limit (default 50)
  arcforges.foundation.v1.Revision revision = 3 [json_name = "revision"];
}

message PlayPurchaseInput {
  optional string purchase_token = 1 [json_name = "purchaseToken"]; // validate: required; <= 4096 chars
  optional string product_id = 2 [json_name = "productId"]; // validate: "arcforges.pro"
  optional string base_plan_id = 3 [json_name = "basePlanId"]; // validate: monthly | annual
  optional string package_name = 4 [json_name = "packageName"]; // validate: the app's package
  optional string order_id = 5 [json_name = "orderId"];
}

message SubscriptionView {
  optional SubscriptionSource source = 1 [json_name = "source"];
  optional string plan = 2 [json_name = "plan"];
  optional SubscriptionState state = 3 [json_name = "state"];
  arcforges.foundation.v1.Instant renews_at = 4 [json_name = "renewsAt"];
  arcforges.foundation.v1.Instant ends_at = 5 [json_name = "endsAt"];
  optional string manage_url = 6 [json_name = "manageUrl"]; // Paddle customer portal or Google Play subscription center
  optional bool payment_issue = 7 [json_name = "paymentIssue"];
}

message PlayPurchaseResult {
  optional string purchase_token_hash = 1 [json_name = "purchaseTokenHash"];
  optional PlayLinkState link_state = 2 [json_name = "linkState"];
  SubscriptionView subscription = 3 [json_name = "subscription"];
  optional bool acknowledged = 4 [json_name = "acknowledged"];
}

message BillingStatus {
  repeated SubscriptionView subscriptions = 1 [json_name = "subscriptions"];
  optional string effective_plan = 2 [json_name = "effectivePlan"];
  repeated string features = 3 [json_name = "features"];
  optional bool duplicate_warning = 4 [json_name = "duplicateWarning"];
  optional bool sales_open = 5 [json_name = "salesOpen"];
}

message NodeCursorInput {
  arcforges.foundation.v1.Id node_id = 1 [json_name = "nodeId"];
  optional uint64 generation = 2 [json_name = "generation"];
  optional uint64 seq = 3 [json_name = "seq"];
}