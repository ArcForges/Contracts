enum RemoteCommandState {
  REMOTE_COMMAND_STATE_UNSPECIFIED = 0;
  REMOTE_COMMAND_STATE_ACCEPTED = 1;
  REMOTE_COMMAND_STATE_DELIVERED = 2;
  REMOTE_COMMAND_STATE_SUCCEEDED = 3;
  REMOTE_COMMAND_STATE_FAILED = 4;
  REMOTE_COMMAND_STATE_REJECTED_BY_NODE = 5;
  REMOTE_COMMAND_STATE_EXPIRED = 6;
  REMOTE_COMMAND_STATE_CANCELLED = 7;
