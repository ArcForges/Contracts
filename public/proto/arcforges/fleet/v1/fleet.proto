// Node registry, relay tokens, viewer grants, live fleet state and remote commands.
service FleetService {
  // List the account's nodes with cached status summaries.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc ListNodes(FleetServiceListNodesRequest) returns (FleetServiceListNodesResponse);

  // Read one node with its recent remote commands.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: cloud
  rpc GetNode(FleetServiceGetNodeRequest) returns (FleetServiceGetNodeResponse);

  // Rename a node in the registry (the node adopts the name on next contact).
  // auth: account session
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, VALIDATION/invalid_argument
  // locality: cloud
  rpc RenameNode(FleetServiceRenameNodeRequest) returns (FleetServiceRenameNodeResponse);

  // Revoke a node: credential, certificates and relay tokens. The node learns it through the relay or its next call.
  // auth: account session with step-up
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, AUTHENTICATION/step_up_required
  // locality: cloud
  rpc RevokeNode(FleetServiceRevokeNodeRequest) returns (FleetServiceRevokeNodeResponse);

  // Relay token for the node uplink (10 section 3.4).
  // auth: node credential; plan relay node limit
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: ENTITLEMENT/feature_not_entitled, ENTITLEMENT/plan_limit_reached, RESOURCE/kill_switch_active, AUTHENTICATION/credential_revoked, VALIDATION/incompatible_version
  // locality: cloud
  // state: SM-RELAY: CONNECTING
  rpc IssueRelayToken(FleetServiceIssueRelayTokenRequest) returns (FleetServiceIssueRelayTokenResponse);

  // Viewer grant for the relay WebSocket (10 section 3.5).
  // auth: account session; entitlement remote.view; concurrent viewer limit
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: ENTITLEMENT/feature_not_entitled, ENTITLEMENT/plan_limit_reached, RESOURCE/kill_switch_active
  // locality: cloud
  rpc OpenFleetWatch(FleetServiceOpenFleetWatchRequest) returns (FleetServiceOpenFleetWatchResponse);

  // gRPC-Web streaming fallback for viewers that cannot use WebSockets (10-minute lifetime cap).
  // auth: account session; entitlement remote.view
  // idempotency: read
  // deadline: 10 min lifetime; heartbeat 15 s
  // stream: server (gRPC-Web text): FleetServiceWatchFleetFrame
  // errors: ENTITLEMENT/feature_not_entitled, RESOURCE/kill_switch_active
  // locality: cloud
  rpc WatchFleet(FleetServiceWatchFleetRequest) returns (stream FleetServiceWatchFleetFrame);

  // Send a command to a node through the relay (AD-0009 section 5).
  // auth: account session; entitlement remote.control; step-up for MEDIUM and HIGH
  // idempotency: command_id (meta.command_id becomes the NodeCommand ID)
  // deadline: 10 s
  // stream: none
  // errors: ENTITLEMENT/feature_not_entitled, AUTHENTICATION/step_up_required, RESOURCE/rate_limited, RESOURCE/kill_switch_active, STATE/not_found, VALIDATION/invalid_argument
  // locality: cloud -> relay -> node
  // state: SM-REMOTE-COMMAND: (none) -> ACCEPTED -> DELIVERED -> SUCCEEDED | FAILED | REJECTED_BY_NODE; ACCEPTED|DELIVERED -> EXPIRED
  rpc SendNodeCommand(FleetServiceSendNodeCommandRequest) returns (FleetServiceSendNodeCommandResponse);

  // Read a remote command.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: cloud
  rpc GetNodeCommand(FleetServiceGetNodeCommandRequest) returns (FleetServiceGetNodeCommandResponse);

  // List remote commands for a node, newest first.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, VALIDATION/invalid_cursor
  // locality: cloud
  rpc ListNodeCommands(FleetServiceListNodeCommandsRequest) returns (FleetServiceListNodeCommandsResponse);

  // Push notification preferences per kind and node.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc GetPushPreferences(FleetServiceGetPushPreferencesRequest) returns (FleetServiceGetPushPreferencesResponse);

  // Replace push preferences (meta.expected_rev = preferences revision).
  // auth: account session; entitlement push
  // idempotency: command_id; expected_rev
  // deadline: 5 s
  // stream: none
  // errors: VALIDATION/invalid_argument, CONFLICT/revision_conflict, ENTITLEMENT/feature_not_entitled
  // locality: cloud
  rpc UpdatePushPreferences(FleetServiceUpdatePushPreferencesRequest) returns (FleetServiceUpdatePushPreferencesResponse);

  // Cancel a command that has not been delivered.
  // auth: account session
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, STATE/invalid_state
  // locality: cloud
  // state: SM-REMOTE-COMMAND: ACCEPTED -> CANCELLED
  rpc CancelNodeCommand(FleetServiceCancelNodeCommandRequest) returns (FleetServiceCancelNodeCommandResponse);
}

