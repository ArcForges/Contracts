// Google Play purchase linking, restore and the combined billing status (AD-0010 section 3).
service StoreBillingService {
  // Opaque reference to pass as obfuscatedAccountId when launching a purchase.
  // auth: account session (Android)
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc GetPlayAccountReference(StoreBillingServiceGetPlayAccountReferenceRequest) returns (StoreBillingServiceGetPlayAccountReferenceResponse);

  // Verify a purchase with subscriptionsv2, link it, grant, and acknowledge server-side.
  // auth: account session (Android)
  // idempotency: natural: per purchase token
  // deadline: 20 s
  // stream: none
  // errors: VALIDATION/purchase_invalid, CONFLICT/purchase_already_linked, AUTHORIZATION/account_mismatch, STATE/purchase_pending, EXECUTION/provider_error, RESOURCE/overloaded
  // locality: cloud -> Google Play
  // state: SM-SUBSCRIPTION: (none) -> ACTIVE | PENDING
  rpc SubmitPlayPurchase(StoreBillingServiceSubmitPlayPurchaseRequest) returns (StoreBillingServiceSubmitPlayPurchaseResponse);

  // Resubmit existing purchases. Purchases without an account reference return NEEDS_CONFIRMATION.
  // auth: account session (Android)
  // idempotency: natural: per purchase token
  // deadline: 30 s
  // stream: none
  // errors: VALIDATION/purchase_invalid, EXECUTION/provider_error
  // locality: cloud -> Google Play
  rpc RestorePlayPurchases(StoreBillingServiceRestorePlayPurchasesRequest) returns (StoreBillingServiceRestorePlayPurchasesResponse);

  // Link a purchase made outside the app after the user's explicit confirmation.
  // auth: account session (Android) with step-up
  // idempotency: natural
  // deadline: 20 s
  // stream: none
  // errors: STATE/not_found, CONFLICT/purchase_already_linked, AUTHENTICATION/step_up_required
  // locality: cloud
  rpc ConfirmPurchaseLink(StoreBillingServiceConfirmPurchaseLinkRequest) returns (StoreBillingServiceConfirmPurchaseLinkResponse);

  // Subscriptions from all sources, the effective plan and duplicate warnings.
  // auth: account session
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: none (implicit codes only)
  // locality: cloud
  rpc GetBillingStatus(StoreBillingServiceGetBillingStatusRequest) returns (StoreBillingServiceGetBillingStatusResponse);
}

