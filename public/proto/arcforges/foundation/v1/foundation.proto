syntax = "proto3";

package arcforges.foundation.v1;

option csharp_namespace = "ArcForges.Contracts.Foundation.V1";
option java_package = "io.github.arcforges.contracts.foundation.v1";
option java_multiple_files = true;
option java_outer_classname = "FoundationProto";

// Complete selected registry04 records; shape constraints are owned beside this schema.
message Id { optional bytes value = 1 [json_name = "value"]; }
message Revision { optional int64 value = 1 [json_name = "value"]; }
message LocalNotesVersion {
  Revision acked_rev = 1 [json_name = "ackedRev"];
  optional uint64 head_local_seq = 2 [json_name = "headLocalSeq"];
}
message NativeContentRev { optional uint64 value = 1 [json_name = "value"]; }
message Instant {
  optional sint64 unix_seconds = 1 [json_name = "unixSeconds"];
  optional uint32 nanos = 2 [json_name = "nanos"];
}
message Decimal { optional string value = 1 [json_name = "value"]; }
message AggregateRef {
  optional string kind = 1 [json_name = "kind"];
  Id id = 2 [json_name = "id"];
}
message VersionedRef {
  AggregateRef root = 1 [json_name = "root"];
  Revision revision = 2 [json_name = "revision"];
  optional string sha256 = 3 [json_name = "sha256"];
}
enum EffectCertainty {
  EFFECT_CERTAINTY_UNSPECIFIED = 0;
  EFFECT_CERTAINTY_DID_NOT_HAPPEN = 1;
  EFFECT_CERTAINTY_HAPPENED = 2;
  EFFECT_CERTAINTY_UNKNOWN = 3;
}
enum RetryMode {
  RETRY_MODE_UNSPECIFIED = 0;
  RETRY_MODE_NEVER = 1;
  RETRY_MODE_SAME_COMMAND = 2;
  RETRY_MODE_AFTER_TIME = 3;
  RETRY_MODE_RECONCILE = 4;
}
enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_VALIDATION = 1;
  ERROR_CATEGORY_AUTHENTICATION = 2;
  ERROR_CATEGORY_AUTHORIZATION = 3;
  ERROR_CATEGORY_ENTITLEMENT = 4;
  ERROR_CATEGORY_CONFLICT = 5;
  ERROR_CATEGORY_STATE = 6;
  ERROR_CATEGORY_RESOURCE = 7;
  ERROR_CATEGORY_EXECUTION = 8;
  ERROR_CATEGORY_INTERNAL = 9;
}
message Receipt {
  Id command_id = 1 [json_name = "commandId"];
  Revision result_revision = 2 [json_name = "resultRevision"];
  optional EffectCertainty effect = 3 [json_name = "effect"];
}
message ApplicationScope {
  optional string product_id = 1 [json_name = "productId"];
  Id installation_id = 2 [json_name = "installationId"];
}
message RequestMeta {
  Id command_id = 1 [json_name = "commandId"];
  Revision expected_rev = 2 [json_name = "expectedRev"];
  Id correlation_id = 3 [json_name = "correlationId"];
  Id workspace_id = 4 [json_name = "workspaceId"];
  LocalNotesVersion expected_local = 5 [json_name = "expectedLocal"];
  NativeContentRev expected_native = 6 [json_name = "expectedNative"];
  optional uint64 recovery_generation = 7 [json_name = "recoveryGeneration"];
  ApplicationScope application_scope = 8 [json_name = "applicationScope"];
}
message ResponseMeta {
  Revision result_rev = 1 [json_name = "resultRev"];
  optional int64 entitlement_version = 2 [json_name = "entitlementVersion"];
  repeated string warnings = 3 [json_name = "warnings"];
  Id correlation_id = 4 [json_name = "correlationId"];
  optional uint64 recovery_generation = 5 [json_name = "recoveryGeneration"];
}
message ArcError {
  optional string code = 1 [json_name = "code"];
  optional ErrorCategory category = 2 [json_name = "category"];
  optional string message_key = 3 [json_name = "messageKey"];
  RetryAdvice retry = 4 [json_name = "retry"];
  optional EffectCertainty effect = 5 [json_name = "effect"];
  Id correlation_id = 6 [json_name = "correlationId"];
  ErrorDetails details = 7 [json_name = "details"];
}
message RetryAdvice {
  optional RetryMode mode = 1 [json_name = "mode"];
  Instant retry_at = 2 [json_name = "retryAt"];
  optional string reconciliation_operation = 3 [json_name = "reconciliationOperation"];
}
message ErrorDetails {
  oneof detail {
    RevisionConflict revision = 1 [json_name = "revision"];
    LimitFailure limit = 2 [json_name = "limit"];
    VersionFailure upgrade = 3 [json_name = "upgrade"];
    StateFailure state = 4 [json_name = "state"];
  }
}
message RevisionConflict {
  Revision expected = 1 [json_name = "expected"];
  Revision actual = 2 [json_name = "actual"];
  Id conflict_id = 3 [json_name = "conflictId"];
}
message LimitFailure {
  optional string limit_name = 1 [json_name = "limitName"];
  Decimal maximum = 2 [json_name = "maximum"];
  Decimal available = 3 [json_name = "available"];
  Instant recovery_at = 4 [json_name = "recoveryAt"];
}
message VersionFailure {
  optional string min_readable = 1 [json_name = "minReadable"];
  optional string min_writable = 2 [json_name = "minWritable"];
  optional string received = 3 [json_name = "received"];
}
message StateFailure {
  optional string state = 1 [json_name = "state"];
  optional string reason = 2 [json_name = "reason"];
  AggregateRef resource = 3 [json_name = "resource"];
  LocalNotesVersion local = 4 [json_name = "local"];
  NativeContentRev native = 5 [json_name = "native"];
}

enum ResourceAvailability {
  RESOURCE_AVAILABILITY_UNSPECIFIED = 0;
  RESOURCE_AVAILABILITY_ALWAYS_KEEP = 1;
  RESOURCE_AVAILABILITY_AVAILABLE_OFFLINE = 2;
  RESOURCE_AVAILABILITY_ON_DEMAND = 3;
  RESOURCE_AVAILABILITY_CLOUD_ONLY = 4;
  RESOURCE_AVAILABILITY_MISSING_EXTERNAL = 5;
}

// registry04: ActorChain; complete selected WP03.01 projection.
message ActorChain {
  Id initiator = 1 [json_name = "initiator"];
  Id owner = 2 [json_name = "owner"];
  optional string actor_kind = 3 [json_name = "actorKind"];
  Id delegation_id = 4 [json_name = "delegationId"];
  Id device_id = 5 [json_name = "deviceId"];
}

// registry04: ArtifactRef; complete selected WP03.01 projection.
message ArtifactRef {
  Id artifact_id = 1 [json_name = "artifactId"];
  optional string kind = 2 [json_name = "kind"];
  AggregateRef owner = 3 [json_name = "owner"];
  ResourceRef resource = 4 [json_name = "resource"];
  Id job_id = 5 [json_name = "jobId"];
  ContentOrigin origin = 6 [json_name = "origin"];
  Id producing_task_id = 7 [json_name = "producingTaskId"];
  Id producing_run_id = 8 [json_name = "producingRunId"];
  ActorChain actor = 9 [json_name = "actor"];
  Instant created_at = 10 [json_name = "createdAt"];
  optional string availability = 11 [json_name = "availability"];
  repeated VersionedRef provenance = 12 [json_name = "provenance"];
}

// registry04: BlobRef; complete selected WP03.01 projection.
message BlobRef {
  Id blob_id = 1 [json_name = "blobId"];
  optional string content_hash = 2 [json_name = "contentHash"];
  optional uint64 size_bytes = 3 [json_name = "sizeBytes"];
}

// registry04: ByteRange; complete selected WP03.01 projection.
message ByteRange {
  optional uint64 offset = 1 [json_name = "offset"];
  optional uint64 length = 2 [json_name = "length"];
}

// registry04: ContentOrigin; complete selected WP03.01 projection.
message ContentOrigin {
  optional string profile = 1 [json_name = "profile"];
  Id origin_id = 2 [json_name = "originId"];
  Id content_unit_id = 3 [json_name = "contentUnitId"];
  repeated string kinds = 4 [json_name = "kinds"];
  optional string payload_sha256 = 5 [json_name = "payloadSha256"];
  optional string producer_kind = 6 [json_name = "producerKind"];
  Instant created_at = 7 [json_name = "createdAt"];
  repeated Id parent_origin_ids = 8 [json_name = "parentOriginIds"];
  optional uint32 omitted_parent_count = 9 [json_name = "omittedParentCount"];
}

// registry04: MediaRange; complete selected WP03.01 projection.
message MediaRange {
  MediaTime start = 1 [json_name = "start"];
  MediaTime duration = 2 [json_name = "duration"];
}

// registry04: MediaTime; complete selected WP03.01 projection.
message MediaTime {
  optional sint64 ticks = 1 [json_name = "ticks"];
  Rational rate = 2 [json_name = "rate"];
}

// registry04: PageRequest; complete selected WP03.01 projection.
message PageRequest {
  optional string cursor = 1 [json_name = "cursor"];
  optional int32 limit = 2 [json_name = "limit"];
}

// registry04: PageState; complete selected WP03.01 projection.
message PageState {
  optional string next_cursor = 1 [json_name = "nextCursor"];
  optional bool has_more = 2 [json_name = "hasMore"];
}

// registry04: Rational; complete selected WP03.01 projection.
message Rational {
  optional sint64 numerator = 1 [json_name = "numerator"];
  optional uint64 denominator = 2 [json_name = "denominator"];
}

// registry04: ResourceRef; complete selected WP03.01 projection.
message ResourceRef {
  Id realm_id = 1 [json_name = "realmId"];
  Id workspace_id = 2 [json_name = "workspaceId"];
  optional string owner_app_id = 3 [json_name = "ownerAppId"];
  optional string resource_kind = 4 [json_name = "resourceKind"];
  Id resource_id = 5 [json_name = "resourceId"];
  optional string display_hint = 6 [json_name = "displayHint"];
  optional ResourceAvailability availability = 7 [json_name = "availability"];
  Id holding_device_id = 8 [json_name = "holdingDeviceId"];
}

// registry04: ResourceVersionRef; complete selected WP03.01 projection.
message ResourceVersionRef {
  ResourceRef resource = 1 [json_name = "resource"];
  optional string content_hash = 5 [json_name = "contentHash"];
  BlobRef blob = 6 [json_name = "blob"];
  oneof revision {
    Revision cloud = 2 [json_name = "cloud"];
    NativeContentRev native = 3 [json_name = "native"];
    LocalNotesVersion local = 4 [json_name = "local"];
  }
}

// registry04: TimeRangeUtc; complete selected WP03.01 projection.
message TimeRangeUtc {
  Instant from = 1 [json_name = "from"];
  Instant until = 2 [json_name = "until"];
}
