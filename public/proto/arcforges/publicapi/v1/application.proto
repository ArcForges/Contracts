// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/publicapi/v1/chat.proto";
import "arcforges/publicapi/v1/content.proto";
import "arcforges/publicapi/v1/inprocess-values.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "ApplicationProto";

// CON.11: application presence and history-import records.
// ApplicationScope and HistoryMode remain owned by Foundation and Content.
service ApplicationService {
  rpc List(ApplicationServiceListRequest) returns (ApplicationServiceListResponse);
  rpc Heartbeat(ApplicationServiceHeartbeatRequest) returns (ApplicationServiceHeartbeatResponse);
  rpc Disconnect(ApplicationServiceDisconnectRequest) returns (ApplicationServiceDisconnectResponse);
}

service HistoryService {
  rpc BeginImport(HistoryServiceBeginImportRequest) returns (HistoryServiceBeginImportResponse);
  rpc FinalizeImport(HistoryServiceFinalizeImportRequest) returns (HistoryServiceFinalizeImportResponse);
  rpc GetImport(HistoryServiceGetImportRequest) returns (HistoryServiceGetImportResponse);
  rpc CancelImport(HistoryServiceCancelImportRequest) returns (HistoryServiceCancelImportResponse);
}

message ApplicationPresence {
  arcforges.publicapi.v1.ApplicationTarget target = 1 [json_name = "target"];
  optional string display_name = 2 [json_name = "displayName"];
  optional string app_version = 3 [json_name = "appVersion"];
  optional string state = 4 [json_name = "state"];
  arcforges.foundation.v1.Instant last_seen_at = 5 [json_name = "lastSeenAt"];
  repeated string available_capabilities = 6 [json_name = "availableCapabilities"];
  arcforges.foundation.v1.Revision revision = 7 [json_name = "revision"];
}

message HistoryImportManifest {
  arcforges.foundation.v1.Id import_id = 1 [json_name = "importId"];
  optional string product_id = 2 [json_name = "productId"];
  optional uint64 source_revision = 3 [json_name = "sourceRevision"];
  arcforges.foundation.v1.ResourceVersionRef archive = 4 [json_name = "archive"];
  optional uint64 message_count = 5 [json_name = "messageCount"];
  optional string manifest_hash = 6 [json_name = "manifestHash"];
  optional string format_version = 7 [json_name = "formatVersion"];
}

message HistoryImportView {
  arcforges.foundation.v1.Id import_id = 1 [json_name = "importId"];
  optional string state = 2 [json_name = "state"];
  arcforges.foundation.v1.Id conversation_id = 3 [json_name = "conversationId"];
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"];
  arcforges.foundation.v1.Revision revision = 5 [json_name = "revision"];
  arcforges.foundation.v1.ArcError failure = 6 [json_name = "failure"];
}

message TransientTurnRequest {
  arcforges.foundation.v1.Id turn_id = 1 [json_name = "turnId"];
  arcforges.foundation.v1.Id branch_id = 2 [json_name = "branchId"];
  optional string request_hash = 3 [json_name = "requestHash"];
  arcforges.publicapi.v1.HistoryMode mode = 4 [json_name = "mode"];
  repeated arcforges.publicapi.v1.MessagePart parts = 5 [json_name = "parts"];
  repeated arcforges.publicapi.v1.ContextRef context = 6 [json_name = "context"];
  arcforges.foundation.v1.Id profile_id = 7 [json_name = "profileId"];
  arcforges.publicapi.v1.ApplicationTarget target = 8 [json_name = "target"];
  arcforges.publicapi.v1.TurnOptions options = 9 [json_name = "options"];
  oneof transcript_source {
    arcforges.publicapi.v1.TranscriptWindow transcript = 10 [json_name = "transcript"];
    arcforges.foundation.v1.ResourceVersionRef transcript_object = 11 [json_name = "transcriptObject"];
  }
  arcforges.publicapi.v1.CompactionRecord compaction = 12 [json_name = "compaction"];
}

message TranscriptWindow {
  arcforges.foundation.v1.Id branch_id = 1 [json_name = "branchId"];
  optional uint64 branch_revision = 2 [json_name = "branchRevision"];
  repeated TranscriptMessage messages = 3 [json_name = "messages"];
  optional uint64 first_ordinal = 4 [json_name = "firstOrdinal"];
  optional uint64 last_ordinal = 5 [json_name = "lastOrdinal"];
  optional string window_hash = 6 [json_name = "windowHash"];
}

message TranscriptMessage {
  arcforges.foundation.v1.Id message_id = 1 [json_name = "messageId"];
  optional uint64 ordinal = 2 [json_name = "ordinal"];
  TranscriptRole role = 3 [json_name = "role"];
  repeated arcforges.publicapi.v1.MessagePart parts = 4 [json_name = "parts"];
  arcforges.foundation.v1.Id tool_call_id = 5 [json_name = "toolCallId"];
  arcforges.foundation.v1.Id tool_result_for = 6 [json_name = "toolResultFor"];
}

enum TranscriptRole {
  TRANSCRIPT_ROLE_UNSPECIFIED = 0;
  TRANSCRIPT_ROLE_USER = 1;
  TRANSCRIPT_ROLE_ASSISTANT = 2;
  TRANSCRIPT_ROLE_TOOL = 3;
  TRANSCRIPT_ROLE_SYSTEM = 4;
}

message CompactionRecord {
  arcforges.foundation.v1.Id compaction_id = 1 [json_name = "compactionId"];
  arcforges.foundation.v1.Id branch_id = 2 [json_name = "branchId"];
  optional uint64 through_ordinal = 3 [json_name = "throughOrdinal"];
  optional string source_hash = 4 [json_name = "sourceHash"];
  optional string summary = 5 [json_name = "summary"];
  optional string model_id = 6 [json_name = "modelId"];
  optional string policy_version = 7 [json_name = "policyVersion"];
  arcforges.foundation.v1.Instant created_at = 8 [json_name = "createdAt"];
  optional string summary_hash = 9 [json_name = "summaryHash"];
}

// Length-delimited assistant-history.v1 archive records. These are data records,
// never authority, capability grants, or pending execution state.
message HistoryArchiveHeader {
  optional string format_version = 1 [json_name = "formatVersion"];
  optional string product_id = 2 [json_name = "productId"];
  arcforges.foundation.v1.Id source_conversation_id = 3 [json_name = "sourceConversationId"];
  optional uint64 source_revision = 4 [json_name = "sourceRevision"];
  optional string title = 5 [json_name = "title"];
  optional uint64 branch_count = 6 [json_name = "branchCount"];
  optional uint64 message_count = 7 [json_name = "messageCount"];
  optional uint64 resource_count = 8 [json_name = "resourceCount"];
}

message HistoryArchiveRecord {
  oneof record {
    HistoryBranch branch = 1 [json_name = "branch"];
    HistoryMessage message = 2 [json_name = "message"];
    arcforges.foundation.v1.ResourceVersionRef resource = 3 [json_name = "resource"];
  }
}

message HistoryMessage {
  arcforges.publicapi.v1.MessageView message = 1 [json_name = "message"];
  optional uint64 ordinal = 2 [json_name = "ordinal"];
  arcforges.foundation.v1.Instant created_at = 3 [json_name = "createdAt"];
}

message HistoryBranch {
  arcforges.foundation.v1.Id branch_id = 1 [json_name = "branchId"];
  arcforges.foundation.v1.Id parent_branch_id = 2 [json_name = "parentBranchId"];
  arcforges.foundation.v1.Id fork_message_id = 3 [json_name = "forkMessageId"];
}

message HistoryArchiveEnd {
  optional uint64 record_count = 1 [json_name = "recordCount"];
  optional string preceding_bytes_hash = 2 [json_name = "precedingBytesHash"];
}

message ApplicationServiceListRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id device_id = 10 [json_name = "deviceId"];
  optional string cursor = 11 [json_name = "cursor"];
  optional uint32 limit = 12 [json_name = "limit"];
}

message ApplicationServiceListValue {
  repeated ApplicationPresence applications = 10 [json_name = "applications"];
  optional string next_cursor = 11 [json_name = "nextCursor"];
}

message ApplicationServiceListResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ApplicationServiceListValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message ApplicationServiceHeartbeatRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  ApplicationTarget target = 10 [json_name = "target"];
  repeated string capabilities = 11 [json_name = "capabilities"];
  optional string app_version = 12 [json_name = "appVersion"];
}

message ApplicationServiceHeartbeatValue {
  ApplicationPresence presence = 10 [json_name = "presence"];
  optional uint32 renew_after_seconds = 11 [json_name = "renewAfterSeconds"];
}

message ApplicationServiceHeartbeatResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ApplicationServiceHeartbeatValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message ApplicationServiceDisconnectRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  ApplicationTarget target = 10 [json_name = "target"];
}

message ApplicationServiceDisconnectValue {}

message ApplicationServiceDisconnectResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ApplicationServiceDisconnectValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message HistoryServiceBeginImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id import_id = 10 [json_name = "importId"];
  optional uint64 source_revision = 11 [json_name = "sourceRevision"];
  optional string manifest_hash = 12 [json_name = "manifestHash"];
}

message HistoryServiceBeginImportValue {
  HistoryImportView import = 10 [json_name = "import"];
}

message HistoryServiceBeginImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    HistoryServiceBeginImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message HistoryServiceFinalizeImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  HistoryImportManifest manifest = 10 [json_name = "manifest"];
}

message HistoryServiceFinalizeImportValue {
  HistoryImportView import = 10 [json_name = "import"];
}

message HistoryServiceFinalizeImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    HistoryServiceFinalizeImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message HistoryServiceGetImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id import_id = 10 [json_name = "importId"];
}

message HistoryServiceGetImportValue {
  HistoryImportView import = 10 [json_name = "import"];
}

message HistoryServiceGetImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    HistoryServiceGetImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}

message HistoryServiceCancelImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id import_id = 10 [json_name = "importId"];
}

message HistoryServiceCancelImportValue {
  HistoryImportView import = 10 [json_name = "import"];
}

message HistoryServiceCancelImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    HistoryServiceCancelImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4;
  reserved 5 to 9;
}
