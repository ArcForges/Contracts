    string text = 1 [json_name = "text"];
    arcforges.foundation.v1.ResourceRef resource = 2 [json_name = "resource"];
    ToolProposal tool_proposal = 3 [json_name = "toolProposal"];
    ToolResult tool_result = 4 [json_name = "toolResult"];
  }
}

// registry04: MessageView; complete selected WP03.01 projection.
message MessageView {
  arcforges.foundation.v1.Id message_id = 1 [json_name = "messageId"];
  arcforges.foundation.v1.Id conversation_id = 2 [json_name = "conversationId"];
  arcforges.foundation.v1.Id branch_id = 3 [json_name = "branchId"];
  optional string role = 4 [json_name = "role"];
  repeated MessagePart parts = 5 [json_name = "parts"];
  optional string state = 6 [json_name = "state"];
  arcforges.foundation.v1.Revision revision = 7 [json_name = "revision"];
  arcforges.foundation.v1.Id task_id = 8 [json_name = "taskId"];
  arcforges.foundation.v1.Id turn_id = 9 [json_name = "turnId"];
}

// registry04: MetadataEntry; complete selected WP03.01 projection.
message MetadataEntry {
  optional string name = 1 [json_name = "name"];
  MetadataScalar value = 2 [json_name = "value"];
}

// registry04: MetadataScalar; complete selected WP03.01 projection.
message MetadataScalar {
  oneof value {
    string text = 1 [json_name = "text"];
    bool boolean = 2 [json_name = "boolean"];
    sint64 integer = 3 [json_name = "integer"];
    double number = 4 [json_name = "number"];
    arcforges.foundation.v1.Decimal decimal = 5 [json_name = "decimal"];
    arcforges.foundation.v1.Instant instant = 6 [json_name = "instant"];
    arcforges.foundation.v1.ResourceRef resource = 7 [json_name = "resource"];
  }
}



















// registry04: PreferenceRecord; complete selected WP03.01 projection.
message PreferenceRecord {
