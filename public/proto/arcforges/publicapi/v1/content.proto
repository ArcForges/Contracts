}

// registry04: ScopeFinding; complete selected WP03.01 projection.
message ScopeFinding {
  arcforges.foundation.v1.Id finding_id = 1 [json_name = "findingId"];
  arcforges.foundation.v1.ResourceVersionRef result = 2 [json_name = "result"];
  optional string text = 3 [json_name = "text"];
  arcforges.foundation.v1.ContentOrigin origin = 4 [json_name = "origin"];
  optional string severity = 5 [json_name = "severity"];
  optional string status = 6 [json_name = "status"];
  repeated ContextRef evidence = 7 [json_name = "evidence"];
  arcforges.foundation.v1.ActorChain actor = 8 [json_name = "actor"];
}

// registry04: ScopeMetadata; complete selected WP03.01 projection.
message ScopeMetadata {
  arcforges.foundation.v1.Id session_id = 1 [json_name = "sessionId"];
  optional string name = 2 [json_name = "name"];
  repeated CaptureMetadata captures = 3 [json_name = "captures"];
  repeated ScopeAnnotation annotations = 4 [json_name = "annotations"];
  repeated ScopeFinding findings = 5 [json_name = "findings"];
  arcforges.foundation.v1.Id project_id = 6 [json_name = "projectId"];
  ScopeConfiguration configuration = 7 [json_name = "configuration"];
  repeated arcforges.foundation.v1.ResourceVersionRef analyses = 8 [json_name = "analyses"];
  repeated arcforges.foundation.v1.ArtifactRef reports = 9 [json_name = "reports"];
  repeated arcforges.foundation.v1.Id tags = 10 [json_name = "tags"];
