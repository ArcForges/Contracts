  arcforges.foundation.v1.Instant ends_at = 5 [json_name = "endsAt"];
  optional string dst_gap = 6 [json_name = "dstGap"];
  optional string dst_overlap = 7 [json_name = "dstOverlap"];
}

// registry04: ScopeAnnotation; complete selected WP03.01 projection.
message ScopeAnnotation {
