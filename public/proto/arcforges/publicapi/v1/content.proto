// registry04: AgentProfile; complete selected WP03.01 projection.
message AgentProfile {
  arcforges.foundation.v1.Id profile_id = 1 [json_name = "profileId"];
  optional string name = 2 [json_name = "name"];
  optional string model_id = 3 [json_name = "modelId"];
  optional string instructions = 4 [json_name = "instructions"];
