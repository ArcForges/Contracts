  CONTROL_KIND_PAUSE = 2;
  CONTROL_KIND_RESUME = 3;
}

enum ControlState {
  CONTROL_STATE_UNSPECIFIED = 0;
  CONTROL_STATE_REQUESTED = 1;
  CONTROL_STATE_ACKNOWLEDGED = 2;
  CONTROL_STATE_REFUSED = 3;
  CONTROL_STATE_COMPLETED = 4;
}

