syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "ContentProto";

// Complete selected public owner-body and profile closure. No service registration.
// Authoritative field allocations: Design registry04 and the WP03.01 profile.

enum ContextLifetime {
  CONTEXT_LIFETIME_UNSPECIFIED = 0;
  CONTEXT_LIFETIME_PINNED = 1;
  CONTEXT_LIFETIME_TURN = 2;
  CONTEXT_LIFETIME_PROJECT = 3;
  CONTEXT_LIFETIME_SELECTION = 4;
}

enum ControlKind {
  CONTROL_KIND_UNSPECIFIED = 0;
  CONTROL_KIND_CANCEL = 1;
  CONTROL_KIND_PAUSE = 2;
  CONTROL_KIND_RESUME = 3;
}

enum ControlState {
  CONTROL_STATE_UNSPECIFIED = 0;
  CONTROL_STATE_REQUESTED = 1;
  CONTROL_STATE_ACKNOWLEDGED = 2;
  CONTROL_STATE_REFUSED = 3;
  CONTROL_STATE_COMPLETED = 4;
}

enum HistoryMode {
  HISTORY_MODE_UNSPECIFIED = 0;
  HISTORY_MODE_LOCAL = 1;
  HISTORY_MODE_CLOUD = 2;
  HISTORY_MODE_TEMPORARY = 3;
}

enum TaskReasonFacet {
  TASK_REASON_FACET_UNSPECIFIED = 0;
  TASK_REASON_FACET_NONE = 1;
  TASK_REASON_FACET_APPROVAL = 2;
  TASK_REASON_FACET_DEVICE = 3;
  TASK_REASON_FACET_CAPACITY = 4;
  TASK_REASON_FACET_DEPENDENCY = 5;
  TASK_REASON_FACET_RECONCILIATION = 6;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_WAITING = 3;
  TASK_STATE_PAUSED = 4;
  TASK_STATE_INTERRUPTED = 5;
  TASK_STATE_SUCCEEDED = 6;
  TASK_STATE_PARTIALLY_SUCCEEDED = 7;
  TASK_STATE_FAILED = 8;
  TASK_STATE_CANCELED = 9;
}

// registry04: AgentProfile; complete selected WP03.01 projection.
message AgentProfile {
  arcforges.foundation.v1.Id profile_id = 1 [json_name = "profileId"];
  optional string name = 2 [json_name = "name"];
  optional string model_id = 3 [json_name = "modelId"];
  optional string instructions = 4 [json_name = "instructions"];
  repeated arcforges.foundation.v1.Id skill_ids = 5 [json_name = "skillIds"];
  arcforges.foundation.v1.Revision revision = 6 [json_name = "revision"];
  repeated ContextRef context = 7 [json_name = "context"];
  repeated string capabilities = 8 [json_name = "capabilities"];
}

// registry04: AggregateBody; complete selected WP03.01 projection.
message AggregateBody {
  oneof body {
    ConversationBody chat = 2 [json_name = "chat"];
    ScopeMetadata scope_metadata = 3 [json_name = "scopeMetadata"];
    AgentProfile agent_profile = 9 [json_name = "agentProfile"];
    SkillRecord skill = 10 [json_name = "skill"];
    ChatProjectRecord chat_project = 11 [json_name = "chatProject"];
    PreferenceRecord preferences = 12 [json_name = "preferences"];
    TaskSnapshot task = 13 [json_name = "task"];
    AutomationView automation = 14 [json_name = "automation"];
    MemoryRecord memory = 15 [json_name = "memory"];
    arcforges.foundation.v1.ResourceVersionRef external_body = 16 [json_name = "externalBody"];
    ScopeProjectMetadata scope_project_metadata = 17 [json_name = "scopeProjectMetadata"];
  }

  reserved 1, 4, 5, 6, 7, 8;
  reserved "notes", "slate_metadata", "notebook", "property_definition", "saved_view", "tag";
}

// registry04: AlignmentSpec; complete selected WP03.01 projection.
message AlignmentSpec {
  optional string kind = 1 [json_name = "kind"];
  ScopeTime left_anchor = 2 [json_name = "leftAnchor"];
  ScopeTime right_anchor = 3 [json_name = "rightAnchor"];
  ScopeTime offset = 4 [json_name = "offset"];
  arcforges.foundation.v1.Id event_id = 5 [json_name = "eventId"];
}

// registry04: AutomationSpec; complete selected WP03.01 projection.
message AutomationSpec {
  optional string name = 1 [json_name = "name"];
  TriggerSpec trigger = 2 [json_name = "trigger"];
  TurnInput input = 3 [json_name = "input"];
  arcforges.foundation.v1.Id profile_id = 4 [json_name = "profileId"];
  optional uint64 per_run_budget = 5 [json_name = "perRunBudget"];
  optional uint64 period_budget = 6 [json_name = "periodBudget"];
  arcforges.foundation.v1.TimeRangeUtc budget_period = 7 [json_name = "budgetPeriod"];
  optional string concurrency = 8 [json_name = "concurrency"];
  optional string misfire = 9 [json_name = "misfire"];
  optional uint32 catch_up_count = 10 [json_name = "catchUpCount"];
  optional uint32 catch_up_window_seconds = 11 [json_name = "catchUpWindowSeconds"];
  repeated arcforges.foundation.v1.Id grants = 12 [json_name = "grants"];
  arcforges.foundation.v1.Id target_device_id = 13 [json_name = "targetDeviceId"];
}

// registry04: AutomationView; complete selected WP03.01 projection.
message AutomationView {
  arcforges.foundation.v1.Id automation_id = 1 [json_name = "automationId"];
  AutomationSpec definition = 2 [json_name = "definition"];
  optional bool enabled = 3 [json_name = "enabled"];
  arcforges.foundation.v1.Revision revision = 4 [json_name = "revision"];
  arcforges.foundation.v1.Instant next_occurrence = 5 [json_name = "nextOccurrence"];
}







// registry04: Calibration; complete selected WP03.01 projection.
message Calibration {
  optional double scale = 1 [json_name = "scale"];
  optional double offset = 2 [json_name = "offset"];
  optional string unit = 3 [json_name = "unit"];
}

// registry04: CapabilityArguments; complete selected WP03.01 projection.
message CapabilityArguments {
  optional string schema_id = 1 [json_name = "schemaId"];
  StructuredValue value = 2 [json_name = "value"];
}

// registry04: CapabilityResult; complete selected WP03.01 projection.
message CapabilityResult {
  optional string schema_id = 1 [json_name = "schemaId"];
  StructuredValue value = 2 [json_name = "value"];
}

// registry04: CaptureMetadata; complete selected WP03.01 projection.
message CaptureMetadata {
  arcforges.foundation.v1.Id capture_id = 1 [json_name = "captureId"];
  optional uint64 sample_count = 2 [json_name = "sampleCount"];
  repeated ChannelDefinition channels = 3 [json_name = "channels"];
  optional string content_hash = 4 [json_name = "contentHash"];
  arcforges.foundation.v1.ResourceRef resource = 5 [json_name = "resource"];
}

// registry04: ChannelDefinition; complete selected WP03.01 projection.
message ChannelDefinition {
  arcforges.foundation.v1.Id channel_id = 1 [json_name = "channelId"];
  optional string name = 2 [json_name = "name"];
  optional string unit = 3 [json_name = "unit"];
  optional string sample_type = 4 [json_name = "sampleType"];
  arcforges.foundation.v1.Rational rate = 5 [json_name = "rate"];
  Calibration calibration = 6 [json_name = "calibration"];
}

// registry04: ChatProjectRecord; complete selected WP03.01 projection.
message ChatProjectRecord {
  arcforges.foundation.v1.Id project_id = 1 [json_name = "projectId"];
  optional string name = 2 [json_name = "name"];
  repeated arcforges.foundation.v1.Id conversation_ids = 3 [json_name = "conversationIds"];
  repeated ContextRef context = 4 [json_name = "context"];
  arcforges.foundation.v1.Revision revision = 5 [json_name = "revision"];
  arcforges.foundation.v1.Instant trashed_at = 6 [json_name = "trashedAt"];
}

// registry04: ChecksumSpec; complete selected WP03.01 projection.
message ChecksumSpec {
  optional string algorithm = 1 [json_name = "algorithm"];
  arcforges.foundation.v1.ByteRange input = 2 [json_name = "input"];
  optional uint32 offset = 3 [json_name = "offset"];
  optional string byte_order = 4 [json_name = "byteOrder"];
}





// registry04: ContextRef; complete selected WP03.01 projection.
message ContextRef {
  arcforges.foundation.v1.AggregateRef source = 1 [json_name = "source"];
  arcforges.foundation.v1.Revision revision = 2 [json_name = "revision"];
  arcforges.foundation.v1.ResourceRef resource = 3 [json_name = "resource"];
  ContextSelector selector = 4 [json_name = "selector"];
  arcforges.foundation.v1.ContentOrigin origin = 5 [json_name = "origin"];
  optional ContextLifetime lifetime = 6 [json_name = "lifetime"];
  EphemeralSelection ephemeral = 7 [json_name = "ephemeral"];
  SourceConsentRef consent = 8 [json_name = "consent"];
}

// registry04: ContextSelector; complete selected WP03.01 projection.
message ContextSelector {
  oneof selection {
    bool whole = 1 [json_name = "whole"];
    arcforges.foundation.v1.ByteRange byte_range = 2 [json_name = "byteRange"];
    ScopeSelection scope = 4 [json_name = "scope"];
  }

  reserved 3, 5;
  reserved "notes", "slate";
}

// registry04: ControlProgress; complete selected WP03.01 projection.
message ControlProgress {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  optional ControlKind kind = 2 [json_name = "kind"];
  optional ControlState state = 3 [json_name = "state"];
  arcforges.foundation.v1.Instant requested_at = 4 [json_name = "requestedAt"];
  arcforges.foundation.v1.Instant acknowledged_at = 5 [json_name = "acknowledgedAt"];
  optional string reason = 6 [json_name = "reason"];
}

// registry04: ConversationBody; complete selected WP03.01 projection.
message ConversationBody {
  ConversationView conversation = 1 [json_name = "conversation"];
  repeated MessageView messages = 2 [json_name = "messages"];
}

// registry04: ConversationView; complete selected WP03.01 projection.
message ConversationView {
  arcforges.foundation.v1.Id conversation_id = 1 [json_name = "conversationId"];
  arcforges.foundation.v1.Id branch_id = 2 [json_name = "branchId"];
  optional string title = 3 [json_name = "title"];
  arcforges.foundation.v1.Revision revision = 4 [json_name = "revision"];
  arcforges.foundation.v1.Instant last_message_at = 5 [json_name = "lastMessageAt"];
  arcforges.foundation.v1.Id project_id = 6 [json_name = "projectId"];
  optional bool pinned = 7 [json_name = "pinned"];
  optional bool archived = 8 [json_name = "archived"];
  optional bool temporary = 9 [json_name = "temporary"];
  arcforges.foundation.v1.ApplicationScope application_scope = 10 [json_name = "applicationScope"];
  optional HistoryMode history_mode = 11 [json_name = "historyMode"];
}

// registry04: CursorResult; complete selected WP03.01 projection.
message CursorResult {
  SelectedSample a = 1 [json_name = "a"];
  SelectedSample b = 2 [json_name = "b"];
  ScopeTime delta_time = 3 [json_name = "deltaTime"];
  optional double delta_value = 4 [json_name = "deltaValue"];
}

// registry04: CursorSpec; complete selected WP03.01 projection.
message CursorSpec {
  arcforges.foundation.v1.Id channel_id = 1 [json_name = "channelId"];
  arcforges.foundation.v1.Id segment_id = 2 [json_name = "segmentId"];
  ScopeTime time = 3 [json_name = "time"];
}





// registry04: EphemeralSelection; complete selected WP03.01 projection.
message EphemeralSelection {
  arcforges.foundation.v1.Id instance_id = 1 [json_name = "instanceId"];
  optional uint64 generation = 2 [json_name = "generation"];
  arcforges.foundation.v1.Id selection_id = 3 [json_name = "selectionId"];
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"];
}

// registry04: EventTrigger; complete selected WP03.01 projection.
message EventTrigger {
  optional string kind = 1 [json_name = "kind"];
  arcforges.foundation.v1.AggregateRef source = 2 [json_name = "source"];

  reserved 3;
  reserved "predicate";
}

// registry04: FamilyResult; complete selected WP03.01 projection.
message FamilyResult {
  optional string family = 1 [json_name = "family"];
  optional string status = 2 [json_name = "status"];
  repeated MeasurementValue values = 3 [json_name = "values"];
  optional uint64 valid_count = 4 [json_name = "validCount"];
  optional uint64 invalid_count = 5 [json_name = "invalidCount"];
  optional string reason = 6 [json_name = "reason"];
  arcforges.foundation.v1.Id channel_id = 7 [json_name = "channelId"];
}





// registry04: FrameConfiguration; complete selected WP03.01 projection.
message FrameConfiguration {
  optional string kind = 1 [json_name = "kind"];
  optional bytes start = 2 [json_name = "start"];
  optional bytes end = 3 [json_name = "end"];
  optional uint32 escape_byte = 4 [json_name = "escapeByte"];
  optional uint32 delimiter = 5 [json_name = "delimiter"];
  optional bool header = 6 [json_name = "header"];
  optional uint32 frame_bytes = 7 [json_name = "frameBytes"];
  optional string byte_order = 8 [json_name = "byteOrder"];
  repeated FrameField fields = 9 [json_name = "fields"];
  ChecksumSpec checksum = 10 [json_name = "checksum"];
}

// registry04: FrameField; complete selected WP03.01 projection.
message FrameField {
  arcforges.foundation.v1.Id channel_id = 1 [json_name = "channelId"];
  optional uint32 column = 2 [json_name = "column"];
  repeated string json_path = 3 [json_name = "jsonPath"];
  optional uint32 offset = 4 [json_name = "offset"];
  optional string scalar_type = 5 [json_name = "scalarType"];
  optional bool required = 6 [json_name = "required"];
}



















// registry04: MeasurementRequest; complete selected WP03.01 projection.
message MeasurementRequest {
  optional string profile = 1 [json_name = "profile"];
  MeasurementSource source = 2 [json_name = "source"];
  arcforges.foundation.v1.NativeContentRev source_revision = 3 [json_name = "sourceRevision"];
  repeated arcforges.foundation.v1.Id channels = 4 [json_name = "channels"];
  MeasurementWindow window = 5 [json_name = "window"];
  repeated string families = 6 [json_name = "families"];
  repeated MeasurementThreshold thresholds = 7 [json_name = "thresholds"];
  ScopeConfiguration configuration = 8 [json_name = "configuration"];
  AlignmentSpec alignment = 9 [json_name = "alignment"];
  repeated CursorSpec cursors = 10 [json_name = "cursors"];
  repeated MeasurementThreshold reference_levels = 11 [json_name = "referenceLevels"];
}

// registry04: MeasurementResult; complete selected WP03.01 projection.
message MeasurementResult {
  optional string profile = 1 [json_name = "profile"];
  optional string input_hash = 2 [json_name = "inputHash"];
  repeated FamilyResult families = 3 [json_name = "families"];
  repeated string warnings = 4 [json_name = "warnings"];
  ScopeConfiguration configuration = 5 [json_name = "configuration"];
  optional uint64 finite_count = 6 [json_name = "finiteCount"];
  optional uint64 excluded_count = 7 [json_name = "excludedCount"];
  optional uint64 run_count = 8 [json_name = "runCount"];
  ScopeTime requested_duration = 9 [json_name = "requestedDuration"];
  ScopeTime covered_duration = 10 [json_name = "coveredDuration"];
  ScopeTime timing_uncertainty = 11 [json_name = "timingUncertainty"];
  MeasurementSource source = 12 [json_name = "source"];
  repeated MeasurementThreshold resolved_thresholds = 13 [json_name = "resolvedThresholds"];
  CursorResult cursor = 14 [json_name = "cursor"];
}

// registry04: MeasurementSource; complete selected WP03.01 projection.
message MeasurementSource {
  arcforges.foundation.v1.ResourceVersionRef capture = 1 [json_name = "capture"];
  arcforges.foundation.v1.Id channel_id = 2 [json_name = "channelId"];
  optional uint64 committed_prefix = 3 [json_name = "committedPrefix"];
  arcforges.foundation.v1.ResourceVersionRef configuration = 4 [json_name = "configuration"];
  arcforges.foundation.v1.ResourceVersionRef decoder = 5 [json_name = "decoder"];
  arcforges.foundation.v1.ResourceVersionRef time_mapping = 6 [json_name = "timeMapping"];
  arcforges.foundation.v1.ResourceVersionRef event_set = 7 [json_name = "eventSet"];
}

// registry04: MeasurementThreshold; complete selected WP03.01 projection.
message MeasurementThreshold {
  optional string family = 1 [json_name = "family"];
  optional string name = 2 [json_name = "name"];
  optional double value = 3 [json_name = "value"];
  optional string unit = 4 [json_name = "unit"];
  arcforges.foundation.v1.Id channel_id = 5 [json_name = "channelId"];
}

// registry04: MeasurementValue; complete selected WP03.01 projection.
message MeasurementValue {
  optional string name = 1 [json_name = "name"];
  optional string unit = 3 [json_name = "unit"];
  oneof result {
    double value = 2 [json_name = "value"];
    uint64 count = 4 [json_name = "count"];
  }
}

// registry04: MeasurementWindow; complete selected WP03.01 projection.
message MeasurementWindow {
  ScopeTime start = 1 [json_name = "start"];
  ScopeTime end = 2 [json_name = "end"];
}









// registry04: MemoryRecord; complete selected WP03.01 projection.
message MemoryRecord {
  arcforges.foundation.v1.Id memory_id = 1 [json_name = "memoryId"];
  optional string text = 2 [json_name = "text"];
  repeated ContextRef sources = 3 [json_name = "sources"];
  arcforges.foundation.v1.Revision revision = 4 [json_name = "revision"];
  optional bool enabled = 5 [json_name = "enabled"];
  arcforges.foundation.v1.ContentOrigin origin = 6 [json_name = "origin"];
}

// registry04: MessageDraft; complete selected WP03.01 projection.
message MessageDraft {
  repeated MessagePart parts = 1 [json_name = "parts"];
  repeated ContextRef context = 2 [json_name = "context"];
}

// registry04: MessagePart; complete selected WP03.01 projection.
message MessagePart {
  arcforges.foundation.v1.ContentOrigin origin = 5 [json_name = "origin"];
