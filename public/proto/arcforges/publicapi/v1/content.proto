  optional string instructions = 3 [json_name = "instructions"];
  repeated arcforges.foundation.v1.ResourceVersionRef resources = 4 [json_name = "resources"];
  repeated string capabilities = 5 [json_name = "capabilities"];
  arcforges.foundation.v1.Revision revision = 6 [json_name = "revision"];
