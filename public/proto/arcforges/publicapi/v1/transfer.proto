syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "TransferProto";

// realm-transfer.v1 schema surface. Included roots and per-root fidelity are
// represented by the typed TransferRoot and TransferIssue records. These
// declarations do not implement import/export jobs or owner authorization.
service TransferService {
  rpc RequestExport(TransferServiceRequestExportRequest) returns (TransferServiceRequestExportResponse);
  rpc PreviewImport(TransferServicePreviewImportRequest) returns (TransferServicePreviewImportResponse);
  rpc CommitImport(TransferServiceCommitImportRequest) returns (TransferServiceCommitImportResponse);
  rpc Get(TransferServiceGetRequest) returns (TransferServiceGetResponse);
  rpc List(TransferServiceListRequest) returns (TransferServiceListResponse);
  rpc Cancel(TransferServiceCancelRequest) returns (TransferServiceCancelResponse);
}

enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  TRANSFER_STATE_QUEUED = 1;
  TRANSFER_STATE_VALIDATING = 2;
  TRANSFER_STATE_WAITING_CONSENT = 3;
  TRANSFER_STATE_IMPORTING = 4;
  TRANSFER_STATE_SUCCEEDED = 5;
  TRANSFER_STATE_PARTIALLY_SUCCEEDED = 6;
  TRANSFER_STATE_FAILED = 7;
  TRANSFER_STATE_CANCELED = 8;
}

message TransferManifest {
  arcforges.foundation.v1.Id transfer_id = 1 [json_name = "transferId"];
  string version = 2 [json_name = "version"];
  string source_realm = 3 [json_name = "sourceRealm"];
  arcforges.foundation.v1.Id source_workspace_id = 4 [json_name = "sourceWorkspaceId"];
  arcforges.foundation.v1.Instant created_at = 5 [json_name = "createdAt"];
  repeated TransferRoot roots = 6 [json_name = "roots"];
  repeated arcforges.foundation.v1.ResourceVersionRef blobs = 7 [json_name = "blobs"];
  string sha256 = 8 [json_name = "sha256"];
}

message TransferRoot {
  arcforges.foundation.v1.VersionedRef source = 1 [json_name = "source"];
  string kind = 2 [json_name = "kind"];
  arcforges.foundation.v1.ResourceVersionRef body = 3 [json_name = "body"];
  arcforges.foundation.v1.ContentOrigin origin = 4 [json_name = "origin"];
  repeated arcforges.foundation.v1.AggregateRef dependencies = 5 [json_name = "dependencies"];
}

message TransferIssue {
  string code = 1 [json_name = "code"];
  arcforges.foundation.v1.AggregateRef source = 2 [json_name = "source"];
  string detail = 3 [json_name = "detail"];
  optional bool blocks_commit = 4 [json_name = "blocksCommit"];
}

message TransferJob {
  arcforges.foundation.v1.Id transfer_id = 1 [json_name = "transferId"];
  TransferState state = 2 [json_name = "state"];
  arcforges.foundation.v1.Revision revision = 3 [json_name = "revision"];
  arcforges.foundation.v1.ResourceVersionRef manifest = 4 [json_name = "manifest"];
  optional string preview_hash = 5 [json_name = "previewHash"];
  uint64 committed_roots = 6 [json_name = "committedRoots"];
  uint64 total_roots = 7 [json_name = "totalRoots"];
  repeated TransferIssue issues = 8 [json_name = "issues"];
  arcforges.foundation.v1.PageState page = 9 [json_name = "page"];
  arcforges.foundation.v1.Instant expires_at = 10 [json_name = "expiresAt"];
}

message TransferMapping {
  arcforges.foundation.v1.AggregateRef source = 1 [json_name = "source"];
  arcforges.foundation.v1.AggregateRef target = 2 [json_name = "target"];
  arcforges.foundation.v1.Revision target_revision = 3 [json_name = "targetRevision"];
  string state = 4 [json_name = "state"];
}

message TransferServiceRequestExportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id transfer_id = 10 [json_name = "transferId"];
  repeated arcforges.foundation.v1.AggregateRef roots = 11 [json_name = "roots"];
}
message TransferServiceRequestExportValue {
  TransferJob job = 10 [json_name = "job"];
}
message TransferServiceRequestExportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServiceRequestExportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}

message TransferServicePreviewImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id transfer_id = 10 [json_name = "transferId"];
  arcforges.foundation.v1.ResourceVersionRef manifest = 11 [json_name = "manifest"];
}
message TransferServicePreviewImportValue {
  TransferJob job = 10 [json_name = "job"];
}
message TransferServicePreviewImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServicePreviewImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}

message TransferServiceCommitImportRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id transfer_id = 10 [json_name = "transferId"];
  string preview_hash = 11 [json_name = "previewHash"];
  repeated string accepted_issues = 12 [json_name = "acceptedIssues"];
}
message TransferServiceCommitImportValue {
  TransferJob job = 10 [json_name = "job"];
}
message TransferServiceCommitImportResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServiceCommitImportValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}

message TransferServiceGetRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id transfer_id = 10 [json_name = "transferId"];
  arcforges.foundation.v1.PageRequest page = 11 [json_name = "page"];
}
message TransferServiceGetValue {
  TransferJob job = 10 [json_name = "job"];
  repeated TransferMapping mappings = 11 [json_name = "mappings"];
}
message TransferServiceGetResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServiceGetValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}

message TransferServiceListRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.PageRequest page = 10 [json_name = "page"];
}
message TransferServiceListValue {
  repeated TransferJob jobs = 10 [json_name = "jobs"];
  arcforges.foundation.v1.PageState page = 11 [json_name = "page"];
}
message TransferServiceListResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServiceListValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}

message TransferServiceCancelRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id transfer_id = 10 [json_name = "transferId"];
}
message TransferServiceCancelValue {
  TransferJob job = 10 [json_name = "job"];
}
message TransferServiceCancelResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TransferServiceCancelValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3;
  }
  reserved 4 to 9;
}
