syntax = "proto3";
package arcforges.publicapi.v1;
import "arcforges/foundation/v1/foundation.proto";
import "arcforges/publicapi/v1/content.proto";
option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "DescriptorsProto";

// Descriptions reference registered providers and preserve ContextRef authority.
message ContextProvider {
  optional string key = 1 [json_name = "key"];
  optional string app_id = 2 [json_name = "appId"];
  optional string title_key = 3 [json_name = "titleKey"];
  repeated string context_kinds = 4 [json_name = "contextKinds"];
  optional uint32 max_items = 5 [json_name = "maxItems"];
  optional uint32 max_bytes = 6 [json_name = "maxBytes"];
}
message ContextDescriptor {
  optional string key = 1 [json_name = "key"];
  optional string provider = 2 [json_name = "provider"];
  optional string kind = 3 [json_name = "kind"];
  optional string title_key = 4 [json_name = "titleKey"];
  ContextRef context = 5 [json_name = "context"];
  arcforges.foundation.v1.Instant observed_at = 6 [json_name = "observedAt"];
}
