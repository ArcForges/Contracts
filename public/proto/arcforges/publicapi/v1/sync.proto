syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/publicapi/v1/content.proto";
import "arcforges/publicapi/v1/inprocess-values.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "SyncProto";

// Public Sync and resource-transfer contracts from registry04. These schemas
// describe typed owner operations; they do not implement owner transactions.
service SyncService {
  rpc ListScopes(SyncServiceListScopesRequest) returns (SyncServiceListScopesResponse);
  rpc SetScope(SyncServiceSetScopeRequest) returns (SyncServiceSetScopeResponse);
  rpc PullChanges(SyncServicePullChangesRequest) returns (SyncServicePullChangesResponse);
  rpc PushChange(SyncServicePushChangeRequest) returns (SyncServicePushChangeResponse);
  rpc PushBatch(SyncServicePushBatchRequest) returns (SyncServicePushBatchResponse);
  rpc GetAggregate(SyncServiceGetAggregateRequest) returns (SyncServiceGetAggregateResponse);
  rpc ListConflicts(SyncServiceListConflictsRequest) returns (SyncServiceListConflictsResponse);
  rpc ResolveConflict(SyncServiceResolveConflictRequest) returns (SyncServiceResolveConflictResponse);
  rpc RequestFullResync(SyncServiceRequestFullResyncRequest) returns (SyncServiceRequestFullResyncResponse);
  rpc GetBootstrapPage(SyncServiceGetBootstrapPageRequest) returns (SyncServiceGetBootstrapPageResponse);
}

service ResourceService {
  rpc BeginUpload(ResourceServiceBeginUploadRequest) returns (ResourceServiceBeginUploadResponse);
  rpc CompleteUpload(ResourceServiceCompleteUploadRequest) returns (ResourceServiceCompleteUploadResponse);
  rpc GetDownloadTicket(ResourceServiceGetDownloadTicketRequest) returns (ResourceServiceGetDownloadTicketResponse);
  rpc GetMetadata(ResourceServiceGetMetadataRequest) returns (ResourceServiceGetMetadataResponse);
  rpc Release(ResourceServiceReleaseRequest) returns (ResourceServiceReleaseResponse);
  rpc GetUploadStatus(ResourceServiceGetUploadStatusRequest) returns (ResourceServiceGetUploadStatusResponse);
  rpc RenewUploadTicket(ResourceServiceRenewUploadTicketRequest) returns (ResourceServiceRenewUploadTicketResponse);
}

enum ResourcePurpose {
  RESOURCE_PURPOSE_UNSPECIFIED = 0;
  RESOURCE_PURPOSE_ATTACHMENT = 1;
  RESOURCE_PURPOSE_EXPORT = 2;
  RESOURCE_PURPOSE_SIMULATOR_SEGMENT = 3;
  RESOURCE_PURPOSE_AI_OUTPUT = 4;
  RESOURCE_PURPOSE_DIAGNOSTIC = 5;
  RESOURCE_PURPOSE_MANAGED_ASSET = 6;
  RESOURCE_PURPOSE_TRANSIENT_INPUT = 7;
}

message SyncScope {
  arcforges.foundation.v1.Id scope_id = 1 [json_name = "scopeId"];
  string kind = 2 [json_name = "kind"];
  bool enabled = 3 [json_name = "enabled"];
  repeated string exclusions = 4 [json_name = "exclusions"];
  arcforges.foundation.v1.Revision revision = 5 [json_name = "revision"];
}

message SyncChange {
  arcforges.foundation.v1.AggregateRef root = 1 [json_name = "root"];
  arcforges.foundation.v1.Revision revision = 2 [json_name = "revision"];
  string schema_version = 3 [json_name = "schemaVersion"];
  bool tombstone = 4 [json_name = "tombstone"];
  arcforges.foundation.v1.Id origin_device_id = 5 [json_name = "originDeviceId"];
  uint64 publication_sequence = 6 [json_name = "publicationSequence"];
}

message ChangeProposal {
  arcforges.foundation.v1.AggregateRef root = 1 [json_name = "root"];
  arcforges.foundation.v1.Revision base_rev = 2 [json_name = "baseRev"];
  uint64 local_sequence = 3 [json_name = "localSequence"];
  arcforges.foundation.v1.Id command_id = 4 [json_name = "commandId"];
  string schema_version = 5 [json_name = "schemaVersion"];
  AggregateBody body = 6 [json_name = "body"];
  string content_hash = 7 [json_name = "contentHash"];
}

message ChangeReceipt {
  arcforges.foundation.v1.Id command_id = 1 [json_name = "commandId"];
  oneof outcome {
    AggregateView accepted = 2 [json_name = "accepted"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
}

message AggregateView {
  arcforges.foundation.v1.AggregateRef root = 1 [json_name = "root"];
  arcforges.foundation.v1.Revision revision = 2 [json_name = "revision"];
  string schema_version = 3 [json_name = "schemaVersion"];
  AggregateBody body = 4 [json_name = "body"];
  bool tombstone = 5 [json_name = "tombstone"];
  string content_hash = 6 [json_name = "contentHash"];
}

message ConflictView {
  arcforges.foundation.v1.Id conflict_id = 1 [json_name = "conflictId"];
  arcforges.foundation.v1.AggregateRef root = 2 [json_name = "root"];
  arcforges.foundation.v1.Revision base_rev = 3 [json_name = "baseRev"];
  arcforges.foundation.v1.Revision current_rev = 4 [json_name = "currentRev"];
  ChangeProposal proposal = 5 [json_name = "proposal"];
  string state = 6 [json_name = "state"];
}

message ConflictResolution {
  string choice = 1 [json_name = "choice"];
  AggregateBody merged_body = 2 [json_name = "mergedBody"];
  string source_proposal_hash = 3 [json_name = "sourceProposalHash"];
}

message BootstrapManifest {
  arcforges.foundation.v1.Id bootstrap_id = 1 [json_name = "bootstrapId"];
  arcforges.foundation.v1.Id scope_id = 2 [json_name = "scopeId"];
  string snapshot_token = 3 [json_name = "snapshotToken"];
  arcforges.foundation.v1.Instant expires_at = 4 [json_name = "expiresAt"];
  string resume_cursor = 5 [json_name = "resumeCursor"];
}

message PartReceipt {
  uint32 part_number = 1 [json_name = "partNumber"];
  uint64 size = 2 [json_name = "size"];
  string sha256 = 3 [json_name = "sha256"];
  string etag = 4 [json_name = "etag"];
}

message UploadTicket {
  arcforges.foundation.v1.Id upload_id = 1 [json_name = "uploadId"];
  arcforges.foundation.v1.Id resource_id = 2 [json_name = "resourceId"];
  arcforges.foundation.v1.TransferTicket ticket = 3 [json_name = "ticket"];
  uint32 part_bytes = 4 [json_name = "partBytes"];
  repeated PartReceipt uploaded = 5 [json_name = "uploaded"];
}

message UploadStatus {
  arcforges.foundation.v1.Id upload_id = 1 [json_name = "uploadId"];
  string state = 2 [json_name = "state"];
  repeated PartReceipt parts = 3 [json_name = "parts"];
  arcforges.foundation.v1.ResourceRef resource = 4 [json_name = "resource"];
  arcforges.foundation.v1.Id provisional_pin = 5 [json_name = "provisionalPin"];
  arcforges.foundation.v1.Instant expires_at = 6 [json_name = "expiresAt"];
  optional string reason = 7 [json_name = "reason"];
  arcforges.foundation.v1.PageState parts_page = 8 [json_name = "partsPage"];
}

message SyncServiceListScopesRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.PageRequest page = 10 [json_name = "page"];
}
message SyncServiceListScopesValue {
  repeated SyncScope items = 10 [json_name = "items"];
  arcforges.foundation.v1.PageState page = 11 [json_name = "page"];
}
message SyncServiceListScopesResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
