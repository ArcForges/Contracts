syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/publicapi/v1/content.proto";
import "arcforges/publicapi/v1/inprocess-values.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "ChatProto";

// CON.10: registered public assistant operations and their owner projections.
// Service names and numbered fields follow Design registry04; in-process IChatOperations
// remains a distinct private surface and is not registered here.
service TaskService {
  rpc List(TaskServiceListRequest) returns (TaskServiceListResponse);
  rpc Get(TaskServiceGetRequest) returns (TaskServiceGetResponse);
  rpc Create(TaskServiceCreateRequest) returns (TaskServiceCreateResponse);
  rpc Cancel(TaskServiceCancelRequest) returns (TaskServiceCancelResponse);
  rpc Pause(TaskServicePauseRequest) returns (TaskServicePauseResponse);
  rpc Resume(TaskServiceResumeRequest) returns (TaskServiceResumeResponse);
  rpc RetryAttempt(TaskServiceRetryAttemptRequest) returns (TaskServiceRetryAttemptResponse);
  rpc Steer(TaskServiceSteerRequest) returns (TaskServiceSteerResponse);
  rpc GetDetails(TaskServiceGetDetailsRequest) returns (TaskServiceGetDetailsResponse);
}

service ApprovalService {
  rpc List(ApprovalServiceListRequest) returns (ApprovalServiceListResponse);
  rpc Decide(ApprovalServiceDecideRequest) returns (ApprovalServiceDecideResponse);
}

service BridgeService {
  rpc PullRequests(BridgeServicePullRequestsRequest) returns (BridgeServicePullRequestsResponse);
  rpc SubmitResult(BridgeServiceSubmitResultRequest) returns (BridgeServiceSubmitResultResponse);
  rpc GetRequestState(BridgeServiceGetRequestStateRequest) returns (BridgeServiceGetRequestStateResponse);
}

service ChatService {
  rpc ListConversations(ChatServiceListConversationsRequest) returns (ChatServiceListConversationsResponse);
  rpc GetConversation(ChatServiceGetConversationRequest) returns (ChatServiceGetConversationResponse);
  rpc AppendMessage(ChatServiceAppendMessageRequest) returns (ChatServiceAppendMessageResponse);
  rpc CreateBranch(ChatServiceCreateBranchRequest) returns (ChatServiceCreateBranchResponse);
  rpc RequestExport(ChatServiceRequestExportRequest) returns (ChatServiceRequestExportResponse);
  rpc CreateConversation(ChatServiceCreateConversationRequest) returns (ChatServiceCreateConversationResponse);
  rpc PutProject(ChatServicePutProjectRequest) returns (ChatServicePutProjectResponse);
  rpc DeleteProject(ChatServiceDeleteProjectRequest) returns (ChatServiceDeleteProjectResponse);
  rpc PutMemory(ChatServicePutMemoryRequest) returns (ChatServicePutMemoryResponse);
  rpc DeleteMemory(ChatServiceDeleteMemoryRequest) returns (ChatServiceDeleteMemoryResponse);
  rpc GetTurn(ChatServiceGetTurnRequest) returns (ChatServiceGetTurnResponse);
  rpc CancelTurn(ChatServiceCancelTurnRequest) returns (ChatServiceCancelTurnResponse);
  rpc PreviewPromotion(ChatServicePreviewPromotionRequest) returns (ChatServicePreviewPromotionResponse);
  rpc PromoteTurn(ChatServicePromoteTurnRequest) returns (ChatServicePromoteTurnResponse);
  rpc CloseTemporary(ChatServiceCloseTemporaryRequest) returns (ChatServiceCloseTemporaryResponse);
  rpc SaveTemporary(ChatServiceSaveTemporaryRequest) returns (ChatServiceSaveTemporaryResponse);
  rpc UpdateConversation(ChatServiceUpdateConversationRequest) returns (ChatServiceUpdateConversationResponse);
  rpc ListProjects(ChatServiceListProjectsRequest) returns (ChatServiceListProjectsResponse);
  rpc GetProject(ChatServiceGetProjectRequest) returns (ChatServiceGetProjectResponse);
  rpc ListMemories(ChatServiceListMemoriesRequest) returns (ChatServiceListMemoriesResponse);
  rpc GetMemory(ChatServiceGetMemoryRequest) returns (ChatServiceGetMemoryResponse);
}

service AgentService {
  rpc ListModels(AgentServiceListModelsRequest) returns (AgentServiceListModelsResponse);
  rpc ListProfiles(AgentServiceListProfilesRequest) returns (AgentServiceListProfilesResponse);
  rpc GetUsage(AgentServiceGetUsageRequest) returns (AgentServiceGetUsageResponse);
  rpc PutProfile(AgentServicePutProfileRequest) returns (AgentServicePutProfileResponse);
  rpc DeleteProfile(AgentServiceDeleteProfileRequest) returns (AgentServiceDeleteProfileResponse);
  rpc PutSkill(AgentServicePutSkillRequest) returns (AgentServicePutSkillResponse);
  rpc DeleteSkill(AgentServiceDeleteSkillRequest) returns (AgentServiceDeleteSkillResponse);
}

service SearchService {
  rpc Query(SearchServiceQueryRequest) returns (SearchServiceQueryResponse);
}

service AutomationService {
  rpc List(AutomationServiceListRequest) returns (AutomationServiceListResponse);
  rpc Get(AutomationServiceGetRequest) returns (AutomationServiceGetResponse);
  rpc Create(AutomationServiceCreateRequest) returns (AutomationServiceCreateResponse);
  rpc Update(AutomationServiceUpdateRequest) returns (AutomationServiceUpdateResponse);
  rpc SetEnabled(AutomationServiceSetEnabledRequest) returns (AutomationServiceSetEnabledResponse);
  rpc Delete(AutomationServiceDeleteRequest) returns (AutomationServiceDeleteResponse);
  rpc RunNow(AutomationServiceRunNowRequest) returns (AutomationServiceRunNowResponse);
  rpc SubmitEvent(AutomationServiceSubmitEventRequest) returns (AutomationServiceSubmitEventResponse);
  rpc ResolveMissed(AutomationServiceResolveMissedRequest) returns (AutomationServiceResolveMissedResponse);
}

service SourceService {
  rpc CreateConsent(SourceServiceCreateConsentRequest) returns (SourceServiceCreateConsentResponse);
  rpc RevokeConsent(SourceServiceRevokeConsentRequest) returns (SourceServiceRevokeConsentResponse);
  rpc GetPolicy(SourceServiceGetPolicyRequest) returns (SourceServiceGetPolicyResponse);
  rpc SetPolicy(SourceServiceSetPolicyRequest) returns (SourceServiceSetPolicyResponse);
  rpc ClearPolicy(SourceServiceClearPolicyRequest) returns (SourceServiceClearPolicyResponse);
}

