syntax = "proto3";

package arcforges.publicapi.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/publicapi/v1/application.proto";
import "arcforges/publicapi/v1/commerce.proto";

option csharp_namespace = "ArcForges.Contracts.PublicApi.V1";
option java_package = "io.github.arcforges.contracts.publicapi.v1";
option java_multiple_files = true;
option java_outer_classname = "IdentityProto";

// CON.07: identity, session, workspace and device operation closure.
// Registry04 section 5 is the numbered authority. Owner authentication, ceremonies,
// persistence and policy stay outside this generated contract.
service IdentityService {
  rpc BeginPasskeyRegistration(IdentityServiceBeginPasskeyRegistrationRequest) returns (IdentityServiceBeginPasskeyRegistrationResponse);
  rpc CompletePasskeyRegistration(IdentityServiceCompletePasskeyRegistrationRequest) returns (IdentityServiceCompletePasskeyRegistrationResponse);
  rpc BeginAuthentication(IdentityServiceBeginAuthenticationRequest) returns (IdentityServiceBeginAuthenticationResponse);
  rpc CompleteAuthentication(IdentityServiceCompleteAuthenticationRequest) returns (IdentityServiceCompleteAuthenticationResponse);
  rpc RequestEmailCode(IdentityServiceRequestEmailCodeRequest) returns (IdentityServiceRequestEmailCodeResponse);
  rpc RedeemEmailCode(IdentityServiceRedeemEmailCodeRequest) returns (IdentityServiceRedeemEmailCodeResponse);
  rpc RefreshSession(IdentityServiceRefreshSessionRequest) returns (IdentityServiceRefreshSessionResponse);
  rpc RevokeSession(IdentityServiceRevokeSessionRequest) returns (IdentityServiceRevokeSessionResponse);
  rpc RevokeAllSessions(IdentityServiceRevokeAllSessionsRequest) returns (IdentityServiceRevokeAllSessionsResponse);
  rpc ListAuthIdentities(IdentityServiceListAuthIdentitiesRequest) returns (IdentityServiceListAuthIdentitiesResponse);
  rpc RemoveAuthIdentity(IdentityServiceRemoveAuthIdentityRequest) returns (IdentityServiceRemoveAuthIdentityResponse);
  rpc BeginStepUp(IdentityServiceBeginStepUpRequest) returns (IdentityServiceBeginStepUpResponse);
  rpc CompleteStepUp(IdentityServiceCompleteStepUpRequest) returns (IdentityServiceCompleteStepUpResponse);
  rpc BeginRecovery(IdentityServiceBeginRecoveryRequest) returns (IdentityServiceBeginRecoveryResponse);
  rpc CompleteRecovery(IdentityServiceCompleteRecoveryRequest) returns (IdentityServiceCompleteRecoveryResponse);
  rpc RequestAccountDeletion(IdentityServiceRequestAccountDeletionRequest) returns (IdentityServiceRequestAccountDeletionResponse);
  rpc CancelAccountDeletion(IdentityServiceCancelAccountDeletionRequest) returns (IdentityServiceCancelAccountDeletionResponse);
  rpc GetProfile(IdentityServiceGetProfileRequest) returns (IdentityServiceGetProfileResponse);
  rpc UpdateProfile(IdentityServiceUpdateProfileRequest) returns (IdentityServiceUpdateProfileResponse);
  rpc ListAuthProviders(IdentityServiceListAuthProvidersRequest) returns (IdentityServiceListAuthProvidersResponse);
  rpc BeginEmailChange(IdentityServiceBeginEmailChangeRequest) returns (IdentityServiceBeginEmailChangeResponse);
  rpc CompleteEmailChange(IdentityServiceCompleteEmailChangeRequest) returns (IdentityServiceCompleteEmailChangeResponse);
  rpc RenameAuthIdentity(IdentityServiceRenameAuthIdentityRequest) returns (IdentityServiceRenameAuthIdentityResponse);
  rpc GenerateRecoveryCodes(IdentityServiceGenerateRecoveryCodesRequest) returns (IdentityServiceGenerateRecoveryCodesResponse);
  rpc ListSessions(IdentityServiceListSessionsRequest) returns (IdentityServiceListSessionsResponse);
  rpc ListApiTokens(IdentityServiceListApiTokensRequest) returns (IdentityServiceListApiTokensResponse);
  rpc CreateApiToken(IdentityServiceCreateApiTokenRequest) returns (IdentityServiceCreateApiTokenResponse);
  rpc RevokeApiToken(IdentityServiceRevokeApiTokenRequest) returns (IdentityServiceRevokeApiTokenResponse);
  rpc ListSecurityActivity(IdentityServiceListSecurityActivityRequest) returns (IdentityServiceListSecurityActivityResponse);
  rpc GetAccountDeletion(IdentityServiceGetAccountDeletionRequest) returns (IdentityServiceGetAccountDeletionResponse);
  rpc ChangePassword(IdentityServiceChangePasswordRequest) returns (IdentityServiceChangePasswordResponse);
  rpc CompleteEnrollment(IdentityServiceCompleteEnrollmentRequest) returns (IdentityServiceCompleteEnrollmentResponse);
}

service WorkspaceService {
  rpc GetHealth(WorkspaceServiceGetHealthRequest) returns (WorkspaceServiceGetHealthResponse);
  rpc RequestDataDeletion(WorkspaceServiceRequestDataDeletionRequest) returns (WorkspaceServiceRequestDataDeletionResponse);
  rpc PreviewDataDeletion(WorkspaceServicePreviewDataDeletionRequest) returns (WorkspaceServicePreviewDataDeletionResponse);
  rpc GetDataDeletion(WorkspaceServiceGetDataDeletionRequest) returns (WorkspaceServiceGetDataDeletionResponse);
  rpc List(WorkspaceServiceListRequest) returns (WorkspaceServiceListResponse);
  rpc Get(WorkspaceServiceGetRequest) returns (WorkspaceServiceGetResponse);
  rpc UpdateSettings(WorkspaceServiceUpdateSettingsRequest) returns (WorkspaceServiceUpdateSettingsResponse);
}

service DeviceService {
  rpc SignOut(DeviceServiceSignOutRequest) returns (DeviceServiceSignOutResponse);
  rpc GetRemotePolicy(DeviceServiceGetRemotePolicyRequest) returns (DeviceServiceGetRemotePolicyResponse);
  rpc SetRemotePolicy(DeviceServiceSetRemotePolicyRequest) returns (DeviceServiceSetRemotePolicyResponse);
  rpc Register(DeviceServiceRegisterRequest) returns (DeviceServiceRegisterResponse);
  rpc List(DeviceServiceListRequest) returns (DeviceServiceListResponse);
  rpc Rename(DeviceServiceRenameRequest) returns (DeviceServiceRenameResponse);
  rpc SetTrust(DeviceServiceSetTrustRequest) returns (DeviceServiceSetTrustResponse);
  rpc SetRemoteEnabled(DeviceServiceSetRemoteEnabledRequest) returns (DeviceServiceSetRemoteEnabledResponse);
  rpc Revoke(DeviceServiceRevokeRequest) returns (DeviceServiceRevokeResponse);
  rpc GetCapabilities(DeviceServiceGetCapabilitiesRequest) returns (DeviceServiceGetCapabilitiesResponse);
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_PASSKEY = 1;
  AUTH_METHOD_EMAIL = 2;
  AUTH_METHOD_PASSWORD = 3;
  AUTH_METHOD_OIDC = 4;
}

enum AuthPurpose {
  AUTH_PURPOSE_UNSPECIFIED = 0;
  AUTH_PURPOSE_AUTHENTICATE = 1;
  AUTH_PURPOSE_ENROLL = 2;
  AUTH_PURPOSE_STEP_UP = 3;
  AUTH_PURPOSE_RECOVER = 4;
  AUTH_PURPOSE_CANCEL_DELETION = 5;
}

enum RecoveryMethod {
  RECOVERY_METHOD_UNSPECIFIED = 0;
  RECOVERY_METHOD_EMAIL_CODE = 1;
  RECOVERY_METHOD_RECOVERY_CODE = 2;
  RECOVERY_METHOD_PASSKEY = 3;
  RECOVERY_METHOD_ADMIN_GRANT = 4;
}

enum ProtectionProfile {
  PROTECTION_PROFILE_UNSPECIFIED = 0;
  PROTECTION_PROFILE_STANDARD = 1;

  reserved 2;
  reserved "PROTECTION_PROFILE_E2EE";
}

enum TrustLevel {
  TRUST_LEVEL_UNSPECIFIED = 0;
  TRUST_LEVEL_UNTRUSTED = 1;
  TRUST_LEVEL_TRUSTED = 2;
  TRUST_LEVEL_REVOKED = 3;
}

message InstallationClaim {
  arcforges.foundation.v1.Id installation_id = 1 [json_name = "installationId"];
  optional string product = 2 [json_name = "product"];
  optional string platform = 3 [json_name = "platform"];
  optional string app_version = 4 [json_name = "appVersion"];
}

message AuthChallenge {
  arcforges.foundation.v1.Id flow_id = 1 [json_name = "flowId"];
  optional AuthMethod method = 2 [json_name = "method"];
  optional bytes challenge = 3 [json_name = "challenge"];
  optional string rp_id = 4 [json_name = "rpId"];
  arcforges.foundation.v1.Instant expires_at = 5 [json_name = "expiresAt"];
  WebAuthnOptions options = 6 [json_name = "options"];
  optional string provider_id = 7 [json_name = "providerId"];
  optional string redirect_url = 8 [json_name = "redirectUrl"];
  optional AuthPurpose purpose = 9 [json_name = "purpose"];
  optional RecoveryMethod recovery_method = 10 [json_name = "recoveryMethod"];
}

message WebAuthnOptions {
  optional string rp_id = 1 [json_name = "rpId"];
  optional bytes user_handle = 2 [json_name = "userHandle"];
  repeated bytes allowed_credentials = 3 [json_name = "allowedCredentials"];
  repeated bytes excluded_credentials = 4 [json_name = "excludedCredentials"];
  optional string user_verification = 5 [json_name = "userVerification"];
  repeated sint32 algorithms = 6 [json_name = "algorithms"];
}

message WebAuthnCreation {
  optional bytes credential_id = 1 [json_name = "credentialId"];
  optional bytes client_data_json = 2 [json_name = "clientDataJson"];
  optional bytes attestation_object = 3 [json_name = "attestationObject"];
  repeated string transports = 4 [json_name = "transports"];
}

message WebAuthnAssertion {
  optional bytes credential_id = 1 [json_name = "credentialId"];
  optional bytes client_data_json = 2 [json_name = "clientDataJson"];
  optional bytes authenticator_data = 3 [json_name = "authenticatorData"];
  optional bytes signature = 4 [json_name = "signature"];
  optional bytes user_handle = 5 [json_name = "userHandle"];
}

message AuthProof {
  oneof proof {
    WebAuthnAssertion passkey = 1 [json_name = "passkey"];
    string email_code = 2 [json_name = "emailCode"];
    string recovery_code = 3 [json_name = "recoveryCode"];
    string password = 4 [json_name = "password"];
    string provider_receipt = 5 [json_name = "providerReceipt"];
    string admin_grant = 6 [json_name = "adminGrant"];
  }
}

