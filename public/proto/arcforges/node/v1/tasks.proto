  optional bytes data = 10 [json_name = "data"];
  repeated OutputIndexRecord index = 11 [json_name = "index"];
  optional uint64 next_offset = 12 [json_name = "nextOffset"];
  optional bool eof = 13 [json_name = "eof"]; // attempt finished and no more bytes
  optional bool truncated_by_retention = 14 [json_name = "truncatedByRetention"];
}

message TaskServiceWatchTaskOutputRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
