  reserved 2 to 9;
  arcforges.foundation.v1.Id attempt_id = 10 [json_name = "attemptId"]; // validate: required
  optional OutputStream stream = 11 [json_name = "stream"]; // validate: default MERGED
  optional uint64 from_offset = 12 [json_name = "fromOffset"]; // MERGED: offset in the merged index order
  optional uint32 max_bytes = 13 [json_name = "maxBytes"]; // validate: 1..4 MiB; default 256 KiB
}
message TaskServiceReadTaskOutputResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceReadTaskOutputValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
