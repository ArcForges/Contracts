syntax = "proto3";

package arcforges.node.v1;

import "arcforges/foundation/v1/foundation.proto";
import "arcforges/node/v1/common.proto";

option csharp_namespace = "ArcForges.Contracts.Node.V1";
option java_package = "io.github.arcforges.contracts.node.v1";
option java_multiple_files = true;
option java_outer_classname = "NodeTasksProto";

// Tasks, attempts, output and control (architecture 04; decisions AD-0006; state machines SM-TASK, SM-ATTEMPT).
// A task is the user-visible unit of work; each execution try is an attempt.

// Task submission, inspection, waiting, attachment, output and control.
// Every mutating call is idempotent by meta.command_id (AD-0004).
service TaskService {
  // Submit a task. It is persisted before the receipt returns (AD-0006 section 1).
  // auth: HUMAN=A SCRIPT=A AGENT=A (allowed_command_patterns) REMOTE=high
  // idempotency: command_id; 24 h; same payload digest required
  // deadline: 10 s
  // stream: none
  // errors: VALIDATION/invalid_argument, VALIDATION/unsafe_batch_argument, VALIDATION/unsupported_shell, VALIDATION/path_not_found, VALIDATION/program_not_found, VALIDATION/invalid_dependency, VALIDATION/inputs_required, AUTHORIZATION/permission_denied, AUTHORIZATION/command_pattern_denied, AUTHORIZATION/approval_required, CONFLICT/command_id_reused, RESOURCE/queue_full, RESOURCE/disk_space, RESOURCE/enforcement_unavailable, STATE/node_stopping
  // locality: node
  // state: SM-TASK: (none) -> QUEUED | WAITING_DEPENDENCY | PLACING
  rpc SubmitTask(TaskServiceSubmitTaskRequest) returns (TaskServiceSubmitTaskResponse);

  // Read one task.
  // auth: HUMAN=A SCRIPT=A AGENT=A (FULL only for own session) REMOTE=-
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied
  // locality: node
  rpc GetTask(TaskServiceGetTaskRequest) returns (TaskServiceGetTaskResponse);

  // List tasks, newest first.
  // auth: HUMAN=A SCRIPT=A AGENT=A (others' tasks as summary) REMOTE=-
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: node
  rpc ListTasks(TaskServiceListTasksRequest) returns (TaskServiceListTasksResponse);

  // Wait up to wait_ms for a target state. Returns the task either way (bounded wait for MCP, 08 section 2.2).
  // auth: HUMAN=A SCRIPT=A AGENT=A REMOTE=-
  // idempotency: read
  // deadline: wait_ms + 5 s
  // stream: none
  // errors: STATE/not_found, VALIDATION/invalid_argument
  // locality: node
  rpc WaitTask(TaskServiceWaitTaskRequest) returns (TaskServiceWaitTaskResponse);

  // Stream state, output, progress, readiness and the final result. The first frame carries an attach_id for stdin. Detaching never affects the task.
  // auth: HUMAN=A SCRIPT=A AGENT=A (own session) REMOTE=-
  // idempotency: read
  // deadline: none; heartbeat 15 s; idle client limit 10 min without reads
  // stream: server: TaskServiceAttachTaskFrame; ends after the result frame of a terminal task
  // errors: STATE/not_found, STATE/invalid_state, AUTHORIZATION/permission_denied
  // locality: node
  rpc AttachTask(TaskServiceAttachTaskRequest) returns (stream TaskServiceAttachTaskFrame);

  // Write stdin bytes for an attached STREAM-stdin task.
  // auth: the attached caller only REMOTE=-
  // idempotency: offset-based
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_attached, STATE/invalid_state, CONFLICT/revision_conflict
  // locality: node
  rpc WriteTaskInput(TaskServiceWriteTaskInputRequest) returns (TaskServiceWriteTaskInputResponse);

  // Close stdin of an attached STREAM-stdin task.
  // auth: the attached caller only REMOTE=-
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_attached
  // locality: node
  rpc CloseTaskInput(TaskServiceCloseTaskInputRequest) returns (TaskServiceCloseTaskInputResponse);

  // Detach a task from its submitting caller: cancel_when_caller_gone no longer applies (hand-off before an AI client's tool timeout; 08 section 4.1).
  // auth: the submitting caller, or HUMAN; REMOTE=-
  // idempotency: natural: releasing twice succeeds
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied
  // locality: node
  rpc ReleaseCallerBinding(TaskServiceReleaseCallerBindingRequest) returns (TaskServiceReleaseCallerBindingResponse);

  // Cancel a queued or running task through the cancellation sequence (04 section 6).
  // auth: own: HUMAN=A SCRIPT=A AGENT=A REMOTE=medium; others: HUMAN=A SCRIPT=P AGENT=P REMOTE=medium
  // idempotency: command_id; cancelling a terminal task returns its state
  // deadline: 10 s (returns after the request is recorded; the sequence continues)
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/approval_required, AUTHORIZATION/permission_denied
  // locality: node
  // state: SM-TASK: QUEUED|WAITING_DEPENDENCY|PLACING|RETRY_WAIT -> CANCELLED; RUNNING|PAUSED -> (attempt STOPPING) -> CANCELLED
  rpc CancelTask(TaskServiceCancelTaskRequest) returns (TaskServiceCancelTaskResponse);

  // Start a new attempt for a terminal task (manual retry; AD-0006 section 4 rules shown as warnings).
  // auth: own: HUMAN=A SCRIPT=A AGENT=A (SIDE_EFFECTING or UNKNOWN: P) REMOTE=-
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, STATE/invalid_state, STATE/secrets_unavailable, AUTHORIZATION/approval_required
  // locality: node
  // state: SM-TASK: FAILED|CANCELLED|LOST -> QUEUED
  rpc RetryTask(TaskServiceRetryTaskRequest) returns (TaskServiceRetryTaskResponse);

  // Change priority or pool of a queued task, or priority (CPU weight) of a running one.
  // auth: HUMAN=A SCRIPT=A AGENT=P REMOTE=medium
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found, STATE/invalid_state, AUTHORIZATION/approval_required, VALIDATION/invalid_argument
  // locality: node
  rpc SetTaskPriority(TaskServiceSetTaskPriorityRequest) returns (TaskServiceSetTaskPriorityResponse);

  // Freeze a running pausable task (Linux only; Windows reports pause unsupported).
  // auth: HUMAN=A SCRIPT=A AGENT=P REMOTE=-
  // idempotency: command_id; pausing a paused task succeeds
  // deadline: 10 s
  // stream: none
  // errors: STATE/pause_unsupported, STATE/invalid_state, STATE/not_found, AUTHORIZATION/approval_required
  // locality: node
  // state: SM-ATTEMPT: RUNNING -> PAUSING -> PAUSED
  rpc PauseTask(TaskServicePauseTaskRequest) returns (TaskServicePauseTaskResponse);

  // Thaw a paused task.
  // auth: HUMAN=A SCRIPT=A AGENT=A REMOTE=-
  // idempotency: command_id
  // deadline: 10 s
  // stream: none
  // errors: STATE/invalid_state, STATE/not_found
  // locality: node
  // state: SM-ATTEMPT: PAUSED -> RUNNING
  rpc ResumeTask(TaskServiceResumeTaskRequest) returns (TaskServiceResumeTaskResponse);

  // Pin or unpin a task's records and output against retention.
  // auth: HUMAN=A SCRIPT=A AGENT=A (own) REMOTE=-
  // idempotency: command_id
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: node
  rpc PinTask(TaskServicePinTaskRequest) returns (TaskServicePinTaskResponse);

  // Delete a terminal task's output and detailed records for privacy. Summary counters remain.
  // auth: HUMAN=A SCRIPT=D AGENT=D REMOTE=-
  // idempotency: command_id
  // deadline: 30 s
  // stream: none
  // errors: STATE/not_found, STATE/invalid_state, AUTHORIZATION/permission_denied
  // locality: node
  rpc PurgeTaskRecord(TaskServicePurgeTaskRecordRequest) returns (TaskServicePurgeTaskRecordResponse);

  // Read captured output bytes with their index records.
  // auth: HUMAN=A SCRIPT=A AGENT=A (own session) REMOTE=low (privacy policy decides)
  // idempotency: read
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found, VALIDATION/invalid_argument, AUTHORIZATION/permission_denied
  // locality: node
  rpc ReadTaskOutput(TaskServiceReadTaskOutputRequest) returns (TaskServiceReadTaskOutputResponse);

  // Stream new output chunks after an optional backfill.
  // auth: HUMAN=A SCRIPT=A AGENT=A (own session) REMOTE=-
  // idempotency: read
  // deadline: none; heartbeat 15 s
  // stream: server: TaskServiceWatchTaskOutputFrame; ends after the result frame
  // errors: STATE/not_found
  // locality: node
  rpc WatchTaskOutput(TaskServiceWatchTaskOutputRequest) returns (stream TaskServiceWatchTaskOutputFrame);

  // Read one attempt.
  // auth: HUMAN=A SCRIPT=A AGENT=A REMOTE=-
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: node
  rpc GetAttempt(TaskServiceGetAttemptRequest) returns (TaskServiceGetAttemptResponse);

  // List the attempts of a task, oldest first.
  // auth: HUMAN=A SCRIPT=A AGENT=A REMOTE=-
  // idempotency: read
  // deadline: 5 s
  // stream: none
  // errors: STATE/not_found
  // locality: node
  rpc ListAttempts(TaskServiceListAttemptsRequest) returns (TaskServiceListAttemptsResponse);

  // Read an attempt's timeline: segments, samples, phases, process records and finding links (07 section 1).
  // auth: HUMAN=A SCRIPT=A AGENT=A REMOTE=-
  // idempotency: read
  // deadline: 10 s
  // stream: none
  // errors: STATE/not_found
  // locality: node
  rpc GetTimeline(TaskServiceGetTimelineRequest) returns (TaskServiceGetTimelineResponse);
}

message TaskServiceSubmitTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  TaskSpec spec = 10 [json_name = "spec"]; // validate: required; see TaskSpec
  arcforges.foundation.v1.Id session_id = 11 [json_name = "sessionId"]; // validate: optional; must be an active session whose agent root is an ancestor of the caller
  optional string agent_id = 12 [json_name = "agentId"]; // validate: <= 128 chars; requires session_id
  ProcessIdentity caller_process = 13 [json_name = "callerProcess"]; // validate: the calling process; verified by the node
  optional bool cancel_when_caller_gone = 14 [json_name = "cancelWhenCallerGone"]; // validate: cancel when the submitting client's connection and all its attach streams are gone for 5 s before the task finishes, unless ReleaseCallerBinding ran first (hook-rewritten runs); a joined submission binds its caller the same way
  optional bool join_existing = 15 [json_name = "joinExisting"]; // validate: return a task of the same session that has not started (QUEUED, WAITING_DEPENDENCY or PLACING) with the same command digest (program and arguments, or the shell string), working directory, environment digest and stdin, instead of a duplicate (08 section 4.1)
}
message TaskServiceSubmitTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceSubmitTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceSubmitTaskValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  arcforges.foundation.v1.Id task_id = 11 [json_name = "taskId"];
  optional TaskState state = 12 [json_name = "state"];
  QueueInfo queue = 13 [json_name = "queue"];
  repeated string warnings = 14 [json_name = "warnings"]; // e.g. unenforced execution, routed parallelism
  optional bool joined = 15 [json_name = "joined"]; // join_existing matched an existing task; task_id is that task
}

message TaskServiceGetTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  optional TaskDetail detail = 11 [json_name = "detail"]; // validate: default SUMMARY
}
message TaskServiceGetTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceGetTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceGetTaskValue {
  ManagedTask task = 10 [json_name = "task"];
}

message TaskServiceListTasksRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  TaskFilter filter = 10 [json_name = "filter"];
  arcforges.foundation.v1.PageRequest page = 11 [json_name = "page"]; // validate: limit 1..500, default 100
}
message TaskServiceListTasksResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceListTasksValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceListTasksValue {
  repeated ManagedTask tasks = 10 [json_name = "tasks"]; // SUMMARY view
  arcforges.foundation.v1.PageState page = 11 [json_name = "page"];
}

message TaskServiceWaitTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  optional WaitTarget target = 11 [json_name = "target"]; // validate: default TERMINAL
  optional uint64 wait_ms = 12 [json_name = "waitMs"]; // validate: 0..55,000
  optional uint32 tail_bytes = 13 [json_name = "tailBytes"]; // validate: 0..65,536; merged output tail to include
}
message TaskServiceWaitTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceWaitTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceWaitTaskValue {
  ManagedTask task = 10 [json_name = "task"];
  optional bool reached = 11 [json_name = "reached"];
  optional bytes tail = 12 [json_name = "tail"];
  optional bool tail_truncated = 13 [json_name = "tailTruncated"];
}

message TaskServiceAttachTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  optional uint64 stdout_from_offset = 11 [json_name = "stdoutFromOffset"];
  optional uint64 stderr_from_offset = 12 [json_name = "stderrFromOffset"];
  optional bool want_stdin = 13 [json_name = "wantStdin"]; // validate: task stdin mode STREAM; one stdin writer at a time
}
message TaskServiceAttachTaskFrame {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  StreamPosition position = 2 [json_name = "position"];
  reserved 3 to 9;
  oneof frame {
    StreamReset reset = 10 [json_name = "reset"];
    Heartbeat heartbeat = 11 [json_name = "heartbeat"];
    arcforges.foundation.v1.ArcError error = 12 [json_name = "error"];
    TaskAttachStarted started = 20 [json_name = "started"];
    ManagedTask task = 21 [json_name = "task"];
    OutputChunk output = 22 [json_name = "output"];
    TaskProgressUpdate progress = 23 [json_name = "progress"];
    AttemptResult result = 24 [json_name = "result"];
  }
}

message TaskServiceWriteTaskInputRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  arcforges.foundation.v1.Id attach_id = 11 [json_name = "attachId"]; // validate: the caller's current attach
  optional bytes data = 12 [json_name = "data"]; // validate: 1 byte..64 KiB
  optional uint64 offset = 13 [json_name = "offset"]; // validate: equals bytes already accepted (ordered, deduplicated writes)
}
message TaskServiceWriteTaskInputResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceWriteTaskInputValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceWriteTaskInputValue {
  optional uint64 accepted_through = 10 [json_name = "acceptedThrough"];
}

message TaskServiceCloseTaskInputRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  arcforges.foundation.v1.Id attach_id = 11 [json_name = "attachId"]; // validate: the caller's current attach
}
message TaskServiceCloseTaskInputResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceCloseTaskInputValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceCloseTaskInputValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
}

message TaskServiceReleaseCallerBindingRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required; submitted by the caller's session or client
}
message TaskServiceReleaseCallerBindingResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceReleaseCallerBindingValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceReleaseCallerBindingValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  optional TaskState state = 11 [json_name = "state"];
}

message TaskServiceCancelTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  optional string reason = 11 [json_name = "reason"]; // validate: <= 500 chars
  optional uint64 grace_ms = 12 [json_name = "graceMs"]; // validate: optional override 0..300 s
}
message TaskServiceCancelTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceCancelTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceCancelTaskValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  optional TaskState state = 11 [json_name = "state"];
}

message TaskServiceRetryTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: terminal task
  optional string reason = 11 [json_name = "reason"]; // validate: <= 500 chars
  ResourceDemand override_demand = 12 [json_name = "overrideDemand"]; // validate: optional larger memory grant after OOM
}
message TaskServiceRetryTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceRetryTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceRetryTaskValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  optional TaskState state = 11 [json_name = "state"];
  repeated string warnings = 12 [json_name = "warnings"];
}

message TaskServiceSetTaskPriorityRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
  optional Priority priority = 11 [json_name = "priority"]; // validate: INTERACTIVE rules as in TaskSpec
  optional string pool = 12 [json_name = "pool"]; // validate: queued tasks only; existing pool
}
message TaskServiceSetTaskPriorityResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceSetTaskPriorityValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServiceSetTaskPriorityValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  QueueInfo queue = 11 [json_name = "queue"];
}

message TaskServicePauseTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
}
message TaskServicePauseTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServicePauseTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
  }
  reserved 4 to 9;
}
message TaskServicePauseTaskValue {
  arcforges.foundation.v1.Receipt receipt = 10 [json_name = "receipt"];
  optional TaskState state = 11 [json_name = "state"];
}

message TaskServiceResumeTaskRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"];
  reserved 2 to 9;
  arcforges.foundation.v1.Id task_id = 10 [json_name = "taskId"]; // validate: required
}
message TaskServiceResumeTaskResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    TaskServiceResumeTaskValue value = 2 [json_name = "value"];
    arcforges.foundation.v1.ArcError error = 3 [json_name = "error"];
