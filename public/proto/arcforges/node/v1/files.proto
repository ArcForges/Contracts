  FilePath path = 10 [json_name = "path"]; // validate: required
  optional string pattern = 11 [json_name = "pattern"]; // validate: required
  optional FileSearchMode mode = 12 [json_name = "mode"]; // validate: required
  optional uint32 max_matches = 13 [json_name = "maxMatches"]; // validate: optional; declared profile bounds apply
  optional uint64 max_scan_bytes = 14 [json_name = "maxScanBytes"]; // validate: optional; declared profile bounds apply
}

message FileServiceSearchFilesValue {
  repeated FileMatch matches = 10 [json_name = "matches"]; // validate: optional; declared profile bounds apply
  optional uint32 visited_entries = 11 [json_name = "visitedEntries"]; // validate: required
  optional uint64 scanned_bytes = 12 [json_name = "scannedBytes"]; // validate: required
  optional uint32 skipped_files = 13 [json_name = "skippedFiles"]; // validate: required
  optional bool truncated = 14 [json_name = "truncated"]; // validate: required
  optional string truncation_reason = 15 [json_name = "truncationReason"]; // validate: optional; declared profile bounds apply
  repeated FileScanProblem problems = 16 [json_name = "problems"]; // validate: optional; declared profile bounds apply
  optional bytes scan_digest = 17 [json_name = "scanDigest"]; // validate: required; 32-byte ordered actual scan transcript digest
  optional uint64 scan_transcript_bytes = 18 [json_name = "scanTranscriptBytes"]; // validate: required; exact digest input length
  optional uint32 scan_file_count = 19 [json_name = "scanFileCount"]; // validate: required; actual nonempty frames
}

